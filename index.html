<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DON&#39;T SMILE</title>
<meta name="theme-color" content="#3A302B">
<meta name="description" content="DON'T SMILE — 웹캠이 웃음을 감지합니다. 몇 초나 버티는지 재고, 무너지는 순간을 9:16 영상으로 남깁니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#0B2415;
  --panel:#123620;
  --line:#1F6135;
  --green:#4CE05B;
  --yellow:#FFD84D;
  --cream:#EAF7DC;
  --muted:#6E9A78;
  --red:#FF5A4D;
  --ink:#03110A;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);
  color:var(--cream);
  font-family:"Galmuri11","Press Start 2P",ui-monospace,monospace;
  font-size:13px;line-height:1.7;
  -webkit-font-smoothing:none;
  font-smooth:never;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
/* 주사선 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 3px);
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;border-radius:0}
input{border-radius:0}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;height:100dvh;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
.wrap{
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  gap:16px;max-width:420px;margin:0 auto;
  padding:calc(var(--st) + 40px) calc(var(--sr) + 20px) calc(var(--sb) + 32px) calc(var(--sl) + 20px);
}
.wrap.top{justify-content:flex-start;gap:14px}

/* ---------- start ---------- */
.lang{
  position:absolute;top:calc(var(--st) + 14px);right:calc(var(--sr) + 16px);
  color:var(--muted);font-size:10px;letter-spacing:.12em;
  border:2px solid var(--line);padding:7px 10px;z-index:5;
}
.lang:hover{color:var(--yellow);border-color:var(--yellow)}
.hero{text-align:center}
.logo{display:block;width:76px;height:76px;margin:0 auto 16px;image-rendering:pixelated}
.title{
  font-family:"Press Start 2P",monospace;
  font-size:clamp(21px,7.2vw,32px);line-height:1.55;letter-spacing:.01em;
  margin:0;color:var(--yellow);
  text-shadow:0 4px 0 var(--ink), 4px 0 0 var(--ink), 0 -4px 0 var(--ink), -4px 0 0 var(--ink);
}
.subko{margin:14px 0 0;font-size:12px;letter-spacing:.18em;color:var(--green)}
.lead{margin:0;font-size:12px;line-height:1.95;color:var(--muted);text-align:center;word-break:keep-all}
.lead b{color:var(--cream);font-weight:400}

.seclabel{font-size:10px;letter-spacing:.2em;color:var(--muted);margin:0 0 8px;text-align:center}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tier{
  border:3px solid var(--line);background:var(--panel);padding:12px 4px 10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  box-shadow:0 4px 0 rgba(0,0,0,.5);
}
.tier:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.5)}
.tier .tn{font-size:12px;color:var(--muted);letter-spacing:.02em}
.tier .td{display:none}
.tier .tv{font-size:9px;color:var(--muted);opacity:.7}
.tier[aria-pressed="true"]{border-color:var(--yellow);background:#1B4A2A}
.tier[aria-pressed="true"] .tn,.tier[aria-pressed="true"] .tv{color:var(--yellow);opacity:1}
.tierdesc{margin:0;font-size:11px;color:var(--muted);text-align:center;min-height:1.7em}

.cta{
  display:block;width:100%;background:var(--yellow);color:var(--ink);
  font-size:15px;letter-spacing:.06em;padding:17px 16px;
  border:3px solid var(--ink);box-shadow:0 6px 0 0 var(--ink);
}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 0 var(--ink)}
.cta[disabled]{opacity:.42;cursor:default;transform:none}
.ghost{
  position:relative;background:var(--panel);border:3px solid var(--line);color:var(--cream);
  font-size:11.5px;letter-spacing:.04em;padding:14px 10px;box-shadow:0 4px 0 rgba(0,0,0,.5);
}
.ghost:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.5)}
.ghost:hover{border-color:var(--green);color:var(--green)}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{
  position:absolute;top:-9px;right:-9px;min-width:20px;height:20px;
  background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;
  padding:0 5px;border:2px solid var(--ink);
}

.note{margin:0;font-size:11px;line-height:1.7;color:var(--muted);min-height:1.7em;text-align:center;word-break:keep-all}
.note.warn{color:var(--yellow)}
.tiny{margin:0;font-size:10px;line-height:1.8;color:var(--muted);opacity:.65;text-align:center;word-break:keep-all}
.diag{
  margin:0;font-family:"GalmuriMono11",ui-monospace,monospace;
  font-size:9px;letter-spacing:.02em;text-align:center;
  color:var(--muted);opacity:.42;word-break:break-all;user-select:all;
}
.diag.bad{color:var(--red);opacity:1}
hr.rule{border:0;border-top:3px solid var(--line);margin:2px 0}

/* ---------- drip ---------- */
.drophead{display:flex;align-items:center;gap:10px}
.back{font-size:16px;color:var(--muted);border:2px solid var(--line);padding:7px 11px;line-height:1}
.back:hover{color:var(--yellow);border-color:var(--yellow)}
.subtitle{font-family:"Press Start 2P",monospace;font-size:15px;margin:0;color:var(--yellow)}
.card{background:var(--panel);border:3px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px}
.field{
  width:100%;border:3px solid var(--line);background:var(--bg);padding:12px 12px;
  font-size:12.5px;font-family:inherit;color:var(--cream);
}
.field::placeholder{color:var(--muted);opacity:.7}
.field:focus{outline:none;border-color:var(--yellow)}
.row2{display:grid;grid-template-columns:84px 1fr;gap:8px}
.emorow{display:flex;flex-wrap:wrap;gap:4px}
.emobtn{font-size:18px;line-height:1;padding:5px;border:2px solid transparent;background:var(--bg)}
.emobtn:hover{border-color:var(--yellow)}
.mylist{display:flex;flex-direction:column;gap:8px}
.drow{position:relative;background:var(--panel);border:3px solid var(--line);padding:12px 12px 28px}
.dhead{display:block;width:100%;text-align:left}
.dq{font-size:11px;color:var(--muted);line-height:1.7;word-break:keep-all}
.da{font-size:13.5px;color:var(--yellow);line-height:1.7;margin-top:3px;word-break:keep-all}
.dmeta{font-size:9.5px;color:var(--muted);margin-top:7px;letter-spacing:.06em}
.dot{position:absolute;top:10px;right:10px;width:9px;height:9px;background:var(--red)}
.dellink{position:absolute;bottom:7px;right:10px;font-size:9.5px;color:var(--muted);padding:4px 5px}
.dellink:hover{color:var(--red)}

/* ---------- result ---------- */
.rescard{border:3px solid var(--line);background:var(--panel);padding:22px 16px 18px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.5)}
.reslabel{font-size:10px;letter-spacing:.2em;color:var(--muted)}
.restime{
  font-family:"Press Start 2P",monospace;line-height:1;color:var(--yellow);
  font-size:clamp(34px,11vw,50px);margin:16px 0 10px;
  text-shadow:0 4px 0 var(--ink);
}
.restime em{font-style:normal;font-size:.44em;color:var(--green);margin-left:.16em;font-family:"Galmuri11",monospace}
.resgrade{font-size:13px;line-height:1.8;color:var(--cream);word-break:keep-all}
.resmeta{margin-top:10px;font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
.vidwrap{display:grid;place-items:center}
#resVideo{
  width:auto;height:auto;max-height:42dvh;max-width:100%;aspect-ratio:9/16;
  background:#000;border:3px solid var(--line);display:block;
}
.vidmiss{display:grid;place-items:center;text-align:center;padding:24px 14px;border:3px dashed var(--line);color:var(--muted);font-size:11px;line-height:1.8}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .cta{grid-column:1 / -1}

/* ---------- joke card ---------- */
.jokecard{background:var(--panel);border:3px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:7px}
.jklabel{font-size:9.5px;letter-spacing:.2em;color:var(--muted)}
.jksetup{font-size:11.5px;color:var(--muted);line-height:1.8;word-break:keep-all}
.jkpunch{font-size:17px;color:var(--yellow);line-height:1.6;word-break:keep-all}
.jkby{font-size:10px;color:var(--green)}
.jkby:empty{display:none}
.jkrow{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:2px}
.jkrow .ghost{padding:12px 12px;font-size:11px;white-space:nowrap}
.cmlist{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.cmlist:empty{display:none}
.cm{background:var(--bg);border:2px solid var(--line);padding:9px 10px}
.cmbody{font-size:11.5px;line-height:1.75;color:var(--cream);word-break:break-word}
.cmmeta{font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:.04em}

/* ---------- game ---------- */
#scr-game{background:var(--bg)}
.stagewrap{
  position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);
  padding:var(--st) var(--sr) var(--sb) var(--sl);
}
#stage{display:block;aspect-ratio:9/16;height:100%;width:auto;max-width:100%;max-height:100%;background:var(--bg)}

/* ---------- hidden cam ---------- */
#cam{position:fixed;left:-12px;top:-12px;width:4px;height:4px;opacity:.001;pointer-events:none;z-index:-1}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>

<!-- ================= START ================= -->
<section id="scr-start" class="screen on">
  <button id="langBtn" class="lang" type="button">EN</button>
  <div class="wrap">
    <header class="hero">
      <div class="logo" id="logo"></div>
      <h1 class="title">DON&#39;T<br>SMILE</h1>
      <p class="subko" data-i="tagline"></p>
    </header>
    <p class="lead" data-ih="lead"></p>
    <hr class="rule">
    <div>
      <p class="seclabel" data-i="diffLabel"></p>
      <div class="tiers" id="tiers">
        <button class="tier" type="button" data-diff="easy" aria-pressed="false">
          <span class="tn" data-i="t_easy"></span><span class="td" data-i="t_easy_d"></span><span class="tv">0.30</span>
        </button>
        <button class="tier" type="button" data-diff="normal" aria-pressed="true">
          <span class="tn" data-i="t_normal"></span><span class="td" data-i="t_normal_d"></span><span class="tv">0.19</span>
        </button>
        <button class="tier" type="button" data-diff="hard" aria-pressed="false">
          <span class="tn" data-i="t_hard"></span><span class="td" data-i="t_hard_d"></span><span class="tv">0.11</span>
        </button>
      </div>
      <p class="tierdesc" id="tierDesc"></p>
    </div>
    <button id="startBtn" class="cta" type="button" data-i="start"></button>
    <div class="btns2">
      <button id="inviteBtn" class="ghost" type="button" data-i="invite"></button>
      <button id="dripBtn" class="ghost" type="button">
        <span data-i="dripEntry"></span>
        <span class="badge" id="dripBadge" hidden></span>
      </button>
    </div>
    <p class="tiny" id="dripSub"></p>
    <p class="note" id="startNote"></p>
    <p class="tiny" data-i="privacy"></p>
    <p class="diag" id="diag"></p>
  </div>
</section>

<!-- ================= DRIP ================= -->
<section id="scr-drip" class="screen">
  <div class="wrap top">
    <div class="drophead">
      <button id="dripBack" class="back" type="button" aria-label="back">&#8592;</button>
      <h2 class="subtitle" data-i="dripTitle"></h2>
    </div>
    <div class="card">
      <p class="seclabel" data-i="newDrip"></p>
      <input id="dSetup" class="field" type="text" maxlength="60" data-ph="phSetup">
      <input id="dPunch" class="field" type="text" maxlength="40" data-ph="phPunch">
      <div class="row2">
        <input id="dEmoji" class="field" type="text" maxlength="4" data-ph="phEmoji">
        <input id="dNick"  class="field" type="text" maxlength="16" data-ph="phNick">
      </div>
      <div class="emorow" id="emoRow"></div>
      <button id="dSubmit" class="cta" type="button" data-i="submitDrip"></button>
      <p class="note" id="dNote"></p>
    </div>
    <div>
      <p class="seclabel" data-i="myDrips"></p>
      <div id="myList" class="mylist"></div>
    </div>
  </div>
</section>

<!-- ================= GAME ================= -->
<section id="scr-game" class="screen">
  <div class="stagewrap"><canvas id="stage" width="720" height="1280"></canvas></div>
</section>

<!-- ================= RESULT ================= -->
<section id="scr-result" class="screen">
  <div class="wrap">
    <div class="rescard">
      <div class="reslabel" data-i="lasted"></div>
      <div class="restime"><span id="resTime">0.0</span><em data-i="sec"></em></div>
      <div class="resgrade" id="resGrade"></div>
      <div class="resmeta" id="resMeta"></div>
    </div>
    <div class="jokecard" id="jokeCard" hidden>
      <div class="jklabel" data-i="brokeBy"></div>
      <div class="jksetup" id="jkSetup"></div>
      <div class="jkpunch"><span id="jkEmoji"></span> <span id="jkPunch"></span></div>
      <div class="jkby" id="jkBy"></div>
      <div class="jkrow">
        <input id="jkInput" class="field" type="text" maxlength="140" data-ph="phComment">
        <button id="jkSend" class="ghost" type="button" data-i="send"></button>
      </div>
      <div class="cmlist" id="jkComments"></div>
    </div>
    <div class="vidwrap" id="vidWrap">
      <video id="resVideo" playsinline controls loop></video>
    </div>
    <div class="btns">
      <button id="shareBtn" class="cta" type="button" data-i="share"></button>
      <button id="saveBtn" class="ghost" type="button" data-i="save"></button>
      <button id="againBtn" class="ghost" type="button" data-i="again"></button>
      <button id="inviteBtn2" class="ghost" type="button" data-i="invite"></button>
      <button id="homeBtn" class="ghost" type="button" data-i="home"></button>
    </div>
    <p class="note" id="resNote"></p>
  </div>
</section>

function rrect(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function emo(c,ch,x,y,size,rot=0,sx=1,sy=1,alpha=1){

  c.translate(x,y); if(rot) c.rotate(rot); if(sx!==1||sy!==1) c.scale(sx,sy);

function txt(c,s,x,y,font,fill,align="center",baseline="middle",stroke=null,lw=8){

}

/* ============================================================
   2. Web Audio — 효과음 실시간 생성 + 녹화용 오디오 믹스
   ============================================================ */
let ac=null, sfxBus=null, recDest=null, micNode=null, noiseBuffer=null;

function unlockAudio(){
  /* 여기서 예외가 새어 나가면 getUserMedia 까지 못 가고 아무 일도 안 일어난다 */
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!ac) ac = new AC();
    if(ac.state === "suspended") ac.resume();
  }catch(e){ console.warn("[audio]", e); }
}
function initAudio(micStream){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  if(!ac) ac = new AC();
  if(ac.state === "suspended") ac.resume();

  if(!sfxBus){
    sfxBus = ac.createGain();
    sfxBus.gain.value = 0.9;
    sfxBus.connect(ac.destination);          // 사용자 스피커
  }
  // 효과음 + 마이크를 하나의 MediaStreamDestination 으로 합쳐 녹화 오디오로 사용
  if(recDest){ try{ sfxBus.disconnect(recDest); }catch(e){} }
  recDest = ac.createMediaStreamDestination();
  sfxBus.connect(recDest);
  try{
    if(micStream && micStream.getAudioTracks().length){
      micNode = ac.createMediaStreamSource(micStream);
      const mg = ac.createGain(); mg.gain.value = 1.0;
      micNode.connect(mg);
      mg.connect(recDest);                   // 스피커로는 안 보냄(하울링 방지)
    }
  }catch(e){ /* 마이크 없으면 효과음만 녹음 */ }
}
function noiseBuf(){
  if(noiseBuffer) return noiseBuffer;
  const n = Math.floor(ac.sampleRate * 0.7);
  const b = ac.createBuffer(1, n, ac.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  noiseBuffer = b; return b;
}
function sfx(name, vol=1){
  if(!ac || !sfxBus || ac.state!=="running") return;
  const t = ac.currentTime;
  const g = ac.createGain(); g.connect(sfxBus); g.gain.value = 0.0001;

  const env=(peak,atk,dec)=>{
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak*vol),t+atk);
    g.gain.exponentialRampToValueAtTime(0.0001,t+atk+dec);
  };
  const noise=(dur,type,freq,q,peak)=>{
    const s=ac.createBufferSource(); s.buffer=noiseBuf();
    const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q)f.Q.value=q;
    const ng=ac.createGain();
    ng.gain.setValueAtTime(Math.max(0.0002,peak*vol),t);
    ng.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(ng); ng.connect(sfxBus);
    s.start(t); s.stop(t+dur);
  };

  if(name==="squeak"){
    const o=ac.createOscillator(); o.type="sawtooth";
    o.frequency.setValueAtTime(760,t);
    o.frequency.exponentialRampToValueAtTime(2350,t+0.085);
    o.frequency.exponentialRampToValueAtTime(1500,t+0.15);
    const f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800; f.Q.value=4.5;
    env(0.34,0.012,0.15);
    o.connect(f); f.connect(g); o.start(t); o.stop(t+0.2);
  }
  else if(name==="boing"){
    const o=ac.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(560,t);
    o.frequency.exponentialRampToValueAtTime(105,t+0.3);
    const lfo=ac.createOscillator(); lfo.type="sine"; lfo.frequency.value=16;
    const lg=ac.createGain(); lg.gain.setValueAtTime(120,t);
    lg.gain.exponentialRampToValueAtTime(4,t+0.34);
    lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t+0.36);
    env(0.42,0.01,0.33);
    o.connect(g); o.start(t); o.stop(t+0.38);
  }
  else if(name==="honk"){
    const o1=ac.createOscillator(); o1.type="square"; o1.frequency.setValueAtTime(233,t);
    o1.frequency.exponentialRampToValueAtTime(196,t+0.2);
    const o2=ac.createOscillator(); o2.type="sawtooth"; o2.frequency.setValueAtTime(235.5,t);
    o2.frequency.exponentialRampToValueAtTime(198,t+0.2);
    const f=ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1500;
    const o2g=ac.createGain(); o2g.gain.value=0.45;
    env(0.3,0.014,0.19);
    o1.connect(f); o2.connect(o2g); o2g.connect(f); f.connect(g);
    o1.start(t); o1.stop(t+0.24); o2.start(t); o2.stop(t+0.24);
  }
  else if(name==="boom"){
    const o=ac.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(150,t);
    o.frequency.exponentialRampToValueAtTime(36,t+0.45);
    env(0.62,0.008,0.5);
    o.connect(g); o.start(t); o.stop(t+0.55);
    noise(0.19,"lowpass",1100,0.9,0.3);
  }
  else if(name==="slide"){
    const o=ac.createOscillator(); o.type="triangle";
    o.frequency.setValueAtTime(280,t);
    o.frequency.exponentialRampToValueAtTime(1650,t+0.4);
    const f=ac.createBiquadFilter(); f.type="lowpass";
    f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(4200,t+0.4);
    env(0.26,0.03,0.4);
    o.connect(f); f.connect(g); o.start(t); o.stop(t+0.46);
  }
}

let faceLandmarker=null, modelPromise=null, modelReady=false, modelFailed=false;

function loadModel(){
  if(modelPromise) return modelPromise;
  modelPromise = (async ()=>{
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    const opts = (delegate)=>({
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate
      },
      outputFaceBlendshapes:true,
      runningMode:"VIDEO",
      numFaces:1
    });
    try{
      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU"));
    }catch(e){
      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU"));
    }
    modelReady = true;
    return faceLandmarker;
  })().catch(e=>{ modelFailed = true; console.error("[model]", e); throw e; });

}

/* ---- 웃음 점수 (지정 공식 그대로) ---- */
function scoreFromBlendshapes(cats){
  const m = Object.create(null);
  for(let i=0;i<cats.length;i++) m[cats[i].categoryName]=cats[i].score;
  const v = k => m[k]||0;
  const smile = (v("mouthSmileLeft")  + v("mouthSmileRight"))  / 2;
  const cheek = (v("cheekSquintLeft") + v("cheekSquintRight")) / 2;
  const press = (v("mouthPressLeft")  + v("mouthPressRight"))  / 2;
  const jawOpen = v("jawOpen");
  return smile + cheek*0.55 + Math.max(0, jawOpen-0.35)*0.5 + press*0.25;
}

let lastVideoTime = -1;
let curScore = 0;
let faceSeen  = false;
let lastFaceAt = 0;

function pollFace(now){
  if(!faceLandmarker || !cam.videoWidth || cam.readyState < 2) return;
  if(cam.currentTime === lastVideoTime) return;   // 프레임이 바뀐 경우에만 호출
  lastVideoTime = cam.currentTime;
  let res;
  try{ res = faceLandmarker.detectForVideo(cam, now); }catch(e){ return; }
  const bs = res && res.faceBlendshapes && res.faceBlendshapes[0];
  if(bs && bs.categories && bs.categories.length){
    curScore = scoreFromBlendshapes(bs.categories);
    faceSeen = true;
    lastFaceAt = now;
  }else{
    faceSeen = false;
    curScore = 0;
  }
}

/* ============================================================
   4. 캔버스 카메라 드로잉 (cover 크롭 + 좌우반전)
   ============================================================ */
function videoCoverRect(dw,dh,zoom){
  const vw=cam.videoWidth, vh=cam.videoHeight;
  if(!vw||!vh) return null;
  const scale = Math.max(dw/vw, dh/vh) * (zoom||1);
  const sw = dw/scale, sh = dh/scale;
  return { sx:(vw-sw)/2, sy:(vh-sh)/2, sw, sh };
}
/* ctx.filter 지원 여부 (Safari 17 미만은 미지원) */
let _filterOK = null;
function filterOK(){
  if(_filterOK !== null) return _filterOK;
  try{
    const t = document.createElement("canvas").getContext("2d");
    t.filter = "blur(2px)";
    _filterOK = (t.filter === "blur(2px)");
  }catch(e){ _filterOK = false; }
  return _filterOK;
}
/* 소프트 포커스: 축소 → 블러 → 낮은 불투명도로 겹치기.
   피부 결만 살짝 눌러 주고 윤곽은 그대로 남는다. 얼굴 인식은
   <video> 원본에서 하므로 이 보정은 판정에 전혀 영향이 없다. */
const scv = document.createElement("canvas"), sctx = scv.getContext("2d");
function softSkin(c, x, y, w, h){
  if(filterOK()){
    const sw = Math.max(8, Math.round(w/4)), sh = Math.max(8, Math.round(h/4));
    scv.width = sw; scv.height = sh;
    sctx.filter = "none";
    sctx.clearRect(0,0,sw,sh);
    try{ sctx.drawImage(c.canvas, x, y, w, h, 0, 0, sw, sh); }catch(e){ return; }
    c.save();
    c.globalAlpha = 0.24;
    c.filter = "blur(5px)";
    try{ c.drawImage(scv, 0, 0, sw, sh, x, y, w, h); }catch(e){}
    c.filter = "none";
    c.restore();
  }
  /* 아주 옅은 웜톤 + 가장자리 살짝 눌러 얼굴이 앞으로 나오게 */
  c.save();
  c.globalCompositeOperation = "soft-light";
  c.fillStyle = "rgba(255,216,196,.16)"; c.fillRect(x,y,w,h);
  c.restore();
  const g = c.createRadialGradient(x+w/2, y+h*0.44, w*0.3, x+w/2, y+h*0.44, w*0.78);
  g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(46,39,36,.16)");
  c.save(); c.fillStyle = g; c.fillRect(x,y,w,h); c.restore();
}
function drawCam(c, dx, dy, dw, dh, zoom, beauty){
  const r = videoCoverRect(dw,dh,zoom);
  if(!r){ c.fillStyle=C.panel; c.fillRect(dx,dy,dw,dh); return false; }
  c.save();
  c.translate(dx+dw, dy); c.scale(-1,1);           // 좌우반전(거울)
  if(beauty && filterOK()) c.filter = "brightness(1.05) contrast(1.02) saturate(1.06)";
  try{ c.drawImage(cam, r.sx, r.sy, r.sw, r.sh, 0, 0, dw, dh); }catch(e){}
  c.filter = "none";
  c.restore();
  if(beauty) softSkin(c, dx, dy, dw, dh);
  return true;
}

function nextJoke(){

  if(userJokes.length && Math.random() < 0.4){
    const u = pick(userJokes);
    return [u.setup, u.punch, u.emoji || "🙂", "u" + u.id, u.nick || ""];
  }
  const lang = JOKES[LANG] ? LANG : "ko";

}

/* ---- 직접 그리는 동물 (전부 도형, 외부 이미지 없음) ---- */
const FUR = ["#FFD84D","#4CE05B","#8FE870","#F7A93B","#EAF7DC","#7FD6C0","#FFB347","#C6F06B","#9AD4FF","#FF9CC0","#E0E0E0"];
function makeCritter(){
  return {
    kind: pick(["dog","dog","cat","frog","duck","bear","blob"]),
    fur : pick(FUR),
    eye : rnd(0.17,0.30), gap: rnd(0.34,0.52),
    plx : rnd(-0.45,0.45), ply: rnd(-0.35,0.35),
    prx : rnd(-0.45,0.45), pry: rnd(-0.35,0.35),
    mouth: pick(["smile","o","wide","zig","flat"]),
    tongue: Math.random() < 0.55,
    brow : pick(["none","none","angry","sad","up"]),
    hat  : Math.random() < 0.26 ? pick(["🎀","👑","🌸","🧢","🍓","🫧","🍀"]) : null,
    blush: Math.random() < 0.5
  };
}
function drawCritter(c, cr, size){
  const R = size*0.40, lw = Math.max(3, size*0.024);
  c.save();
  c.lineJoin = "round"; c.lineCap = "round";
  c.strokeStyle = "#03110A"; c.lineWidth = lw;

  const ear = (sx)=>{
    c.fillStyle = cr.fur;
    if(cr.kind === "cat"){
      c.beginPath(); c.moveTo(sx*R*0.40,-R*0.86); c.lineTo(sx*R*0.98,-R*1.44); c.lineTo(sx*R*1.02,-R*0.56);
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = "#F3A6B0";
      c.beginPath(); c.moveTo(sx*R*0.56,-R*0.88); c.lineTo(sx*R*0.88,-R*1.24); c.lineTo(sx*R*0.90,-R*0.68);
      c.closePath(); c.fill();
    }else if(cr.kind === "dog"){
      c.beginPath(); c.ellipse(sx*R*0.94, R*0.06, R*0.32, R*0.66, sx*0.26, 0, 7); c.fill(); c.stroke();
    }else if(cr.kind === "bear"){
      c.beginPath(); c.arc(sx*R*0.76, -R*0.74, R*0.33, 0, 7); c.fill(); c.stroke();
    }
  };
  if(cr.kind === "cat" || cr.kind === "dog" || cr.kind === "bear"){ ear(-1); ear(1); }

  c.fillStyle = cr.fur;
  c.beginPath();
  if(cr.kind === "blob") c.ellipse(0, R*0.06, R*1.05, R*0.92, 0, 0, 7);
  else c.arc(0, 0, R, 0, 7);
  c.fill(); c.stroke();

  const eyeY = cr.kind === "frog" ? -R*0.68 : -R*0.12;
  const eR   = R*cr.eye*1.6, gx = R*cr.gap;
  const oneEye = (x, px, py)=>{
    c.fillStyle = "#FFFFFF"; c.lineWidth = lw;
    c.beginPath(); c.arc(x, eyeY, eR, 0, 7); c.fill(); c.stroke();
    c.fillStyle = "#03110A";
    c.beginPath(); c.arc(x+px*eR*0.5, eyeY+py*eR*0.5, eR*0.44, 0, 7); c.fill();
    c.fillStyle = "rgba(255,255,255,.92)";
    c.beginPath(); c.arc(x+px*eR*0.5-eR*0.17, eyeY+py*eR*0.5-eR*0.19, eR*0.15, 0, 7); c.fill();
  };
  oneEye(-gx, cr.plx, cr.ply);
  oneEye( gx, cr.prx, cr.pry);

  if(cr.brow !== "none"){
    c.strokeStyle = "#03110A"; c.lineWidth = lw*1.15;
    const by = eyeY - eR*1.4;
    const tilt = cr.brow === "angry" ? 0.44 : cr.brow === "sad" ? -0.44 : 0;
    const rise = cr.brow === "up" ? -R*0.1 : 0;
    for(const sx of [-1,1]){
      c.save(); c.translate(sx*gx, by+rise); c.rotate(sx*tilt);
      c.beginPath(); c.moveTo(-eR*0.7,0); c.lineTo(eR*0.7,0); c.stroke(); c.restore();
    }
  }

  const my = R*0.34;
  c.strokeStyle = "#03110A"; c.lineWidth = lw;
  if(cr.kind === "duck"){
    c.fillStyle = "#FF9E2C";
    c.beginPath(); c.ellipse(0, my*0.74, R*0.46, R*0.25, 0, 0, 7); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-R*0.44, my*0.74); c.lineTo(R*0.44, my*0.74); c.stroke();
  }else{
    if(cr.kind !== "frog"){
      c.fillStyle = "#03110A";
      c.beginPath(); c.ellipse(0, R*0.1, R*0.13, R*0.1, 0, 0, 7); c.fill();
    }
    c.beginPath();
    if(cr.mouth === "smile")      c.arc(0, my*0.45, R*0.34, 0.2*Math.PI, 0.8*Math.PI);
    else if(cr.mouth === "wide")  c.arc(0, my*0.2,  R*0.52, 0.12*Math.PI, 0.88*Math.PI);
    else if(cr.mouth === "o")     c.arc(0, my*0.62, R*0.18, 0, 7);
    else if(cr.mouth === "zig"){
      c.moveTo(-R*0.4, my*0.5);
      for(let i=0;i<5;i++) c.lineTo(-R*0.4+R*0.2*(i+1), my*0.5 + (i%2 ? R*0.13 : -R*0.13));
    }else{ c.moveTo(-R*0.3, my*0.55); c.lineTo(R*0.3, my*0.55); }
    c.stroke();
    if(cr.tongue && cr.mouth !== "flat"){
      c.fillStyle = "#FF6B8A";
      c.beginPath(); c.ellipse(0, my*0.92, R*0.19, R*0.24, 0, 0, 7); c.fill(); c.stroke();
    }
  }
  if(cr.blush){
    c.fillStyle = "rgba(255,90,120,.45)";
    c.beginPath(); c.ellipse(-R*0.66, R*0.24, R*0.19, R*0.12, 0, 0, 7); c.fill();
    c.beginPath(); c.ellipse( R*0.66, R*0.24, R*0.19, R*0.12, 0, 0, 7); c.fill();
  }
  if(cr.hat) emo(c, cr.hat, 0, -R*1.3, R*0.72);
  c.restore();
}

/* ---- 자극이 쓰는 피사체: 그린 동물 또는 이모지 ---- */
function pickSubject(){
  return Math.random() < 0.62 ? { cr: makeCritter() } : { e: pick(EMO_FACE) };
}
function drawSubject(c, s, x, y, size, rot=0, sx=1, sy=1, alpha=1){
  if(s && s.cr){
    c.save(); c.globalAlpha = alpha;
    c.translate(x,y); if(rot) c.rotate(rot); if(sx!==1||sy!==1) c.scale(sx,sy);
    drawCritter(c, s.cr, size);
    c.restore();
  }else{
    emo(c, (s && s.e) || "😂", x, y, size, rot, sx, sy, alpha);
  }
}

/* ---- 자막 / 데코 ---- */
function wrapTwo(c, s, maxW, font, size){
  c.font = size+"px "+font;
  if(c.measureText(s).width <= maxW) return [s];
  const w = String(s).split(" ");
  if(w.length < 2) return [s];
  let best = null, bd = Infinity;
  for(let i=1;i<w.length;i++){
    const a = w.slice(0,i).join(" "), b = w.slice(i).join(" ");
    const d = Math.abs(c.measureText(a).width - c.measureText(b).width);
    if(d < bd){ bd = d; best = [a,b]; }
  }
  return best || [s];
}
function fitLines(c, s, maxW, font, size){
  let fs = size, lines = [s];
  for(let k=0;k<8;k++){
    lines = wrapTwo(c, s, maxW, font, fs);
    c.font = "700 "+fs+"px "+font;
    let w = 0; for(const L of lines) w = Math.max(w, c.measureText(L).width);
    if(w <= maxW || fs <= 24) break;
    fs *= Math.max(0.74, maxW/w);
  }
  return { fs, lines };
}
function capBig(c, s, x, y, size, tilt, punch){
  if(!s) return;
  const { fs, lines } = fitLines(c, s, 630, HEAD, size);
  const lh = fs*1.32;
  const off = Math.max(3, Math.round(fs*0.1));
  c.save(); c.translate(x, y-(lines.length-1)*lh/2); if(tilt) c.rotate(tilt);
  c.font = fs+"px "+HEAD; c.textAlign = "center"; c.textBaseline = "middle";
  lines.forEach((L,i)=>{
    c.fillStyle = "#03110A";                       c.fillText(L, off, i*lh+off);
    c.fillStyle = punch ? "#FFD84D" : "#EAF7DC";   c.fillText(L, 0,   i*lh);
  });
  c.restore();
}
function capSub(c, s, y){
  if(!s) return;
  const { fs, lines } = fitLines(c, s, 600, HEAD, 44);
  const lh = fs*1.12;
  c.save();
  c.font = fs+"px "+HEAD; c.textAlign = "center"; c.textBaseline = "middle";
  let w = 0; for(const L of lines) w = Math.max(w, c.measureText(L).width);
  const bh = lines.length*lh + 24;
  c.fillStyle = "rgba(0,0,0,.62)"; rrect(c, 360-(w+52)/2, y-bh/2, w+52, bh, 12); c.fill();
  c.lineJoin = "round"; c.miterLimit = 2;
  lines.forEach((L,i)=>{
    const yy = y - (lines.length-1)*lh/2 + i*lh;
    c.lineWidth = 10; c.strokeStyle = "#000"; c.strokeText(L, 360, yy);
    c.fillStyle = "#FFFFFF"; c.fillText(L, 360, yy);
  });
  c.restore();
}
/* 얘기가 걸린 자극이면 짧은 자막 자리에 밑밥 → 펀치라인을 대신 띄운다 */
/* 자극마다 썰렁개그 한 편: 밑밥이 깔리고 펀치라인이 이모지와 함께 튀어나온다 */
function stimCap(t, y){
  if(!joke) return;
  if(t < jokePunch){ capSub(ctx, joke[0], y); return; }
  const age = t - jokePunch;
  const pop = 1 + Math.max(0, 1-age*5)*0.42;
  if(joke[2]) emo(ctx, joke[2], 360, y-82, 66*pop, Math.sin(age*8)*0.07);
  capBig(ctx, joke[1], 360, y, 72*pop, Math.sin(age*15)*0.022*Math.max(0,1-age*2.2), true);
  if(joke[4]) txt(ctx, "— " + joke[4], 360, y+48, '400 22px '+BODY, C.muted);
}
function redCircle(c, x, y, rx, ry, t){
  c.save(); c.strokeStyle = "#FFD84D"; c.lineWidth = 12; c.lineCap = "round";
  c.beginPath();
  for(let i=0;i<=46;i++){
    const a = i/46*Math.PI*2*1.09 - 0.5;
    const wob = 1 + Math.sin(a*3 + t*2.2)*0.04;
    const px = x + Math.cos(a)*rx*wob, py = y + Math.sin(a)*ry*wob;
    i ? c.lineTo(px,py) : c.moveTo(px,py);
  }
  c.stroke(); c.restore();
}
function redArrow(c, x1,y1,x2,y2){
  c.save(); c.strokeStyle = "#FFD84D"; c.fillStyle = "#FFD84D"; c.lineWidth = 12; c.lineCap = "round";
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  const a = Math.atan2(y2-y1, x2-x1);
  c.beginPath(); c.moveTo(x2,y2);
  c.lineTo(x2-Math.cos(a-0.42)*40, y2-Math.sin(a-0.42)*40);
  c.lineTo(x2-Math.cos(a+0.42)*40, y2-Math.sin(a+0.42)*40);
  c.closePath(); c.fill(); c.restore();
}
/* 터지는 순간의 부드러운 블룸 (과하지 않게) */
function bloom(c, amt){
  if(amt <= 0) return;
  c.save();
  c.fillStyle = "rgba(255,216,77,"+(0.35*amt)+")"; c.fillRect(0,0,SR.w,SR.h);
  c.fillStyle = "rgba(255,255,255,"+(0.2*amt)+")"; c.fillRect(0,0,SR.w,SR.h);
  c.restore();
}

const STIMS = [st1,st2,st3,st4,st5,st6,st7,st8,st9,st10,st11,st12];
let bag = [], curStim = null, stimStart = 0, stimDur = 0;

function nextStim(now){
  if(!bag.length) bag = shuffle(STIMS.map((_,i)=>i));
  const id = bag.pop();
  curStim = STIMS[id];
  stimStart = now;
  stimDur = rnd(4000,6000);
  ss = {};
  joke = nextJoke();                       // 자극마다 썰렁개그 한 편
  jokePunch = clamp(stimDur/1000*0.5, 1.8, 3.0);
  jokeHit = false;
  if(curStim.init) curStim.init();
}
/* 자극 영역을 절반 해상도 버퍼에 그린 뒤 뭉개짐 없이 2배로 확대한다.
   그러면 그림도 글자도 전부 굵은 도트가 된다. */
const PIX = 2;
const stimBuf = document.createElement("canvas");
stimBuf.width = SR_H === 560 ? W/PIX : W/PIX;
stimBuf.height = SR_H/PIX;
const stimCtx = stimBuf.getContext("2d");

function drawStim(now, dt){
  if(!curStim || now-stimStart > stimDur) nextStim(now);
  const t = (now-stimStart)/1000;
  if(joke && !jokeHit && t >= jokePunch){ jokeHit = true; sfx("honk", 0.6); }

  const g = stimCtx;
  g.setTransform(1/PIX, 0, 0, 1/PIX, 0, 0);
  g.clearRect(0, 0, SR.w, SR.h);
  ctx = g;                                     // 자극 코드가 쓰는 ctx 를 버퍼로 돌린다
  try{
    g.save();
    g.beginPath(); g.rect(0,0,SR.w,SR.h); g.clip();
    curStim.draw(t, dt);
    g.restore();
  }finally{
    ctx = MAIN;
  }
  MAIN.imageSmoothingEnabled = false;
  try{ MAIN.drawImage(stimBuf, 0, 0, stimBuf.width, stimBuf.height, 0, 0, SR.w, SR.h); }catch(e){}
  MAIN.imageSmoothingEnabled = true;
}

/* ============================================================
   6. HUD / 카운트다운 / 실패 연출 렌더링
   ============================================================ */
let barShown = 0;
function sens(){ return SENS[diff]; }
function diffName(){ return T(diff==="easy"?"t_easy":diff==="hard"?"t_hard":"t_normal"); }

function fitFont(s, maxW, family, size){
  const bold = "";
  ctx.font = bold+size+"px "+family;
  let w = ctx.measureText(s).width;
  while(w > maxW && size > 18){ size = size*(maxW/w)*0.985; ctx.font=bold+size+"px "+family; w=ctx.measureText(s).width; }
  return size;
}
/* 블록으로 쪼갠 긴장도 게이지 */
function drawTensionBar(){
  const ratio = clamp((curScore - base)/sens(), 0, 1);
  barShown = lerp(barShown, ratio, 0.35);
  const N = 30, gap = 2, bw = (W - gap*(N-1))/N;
  ctx.fillStyle = "#03110A"; ctx.fillRect(0, H-BAR_H, W, BAR_H);
  const on = Math.round(barShown*N);
  for(let i=0;i<N;i++){
    const p = (i+1)/N;
    ctx.fillStyle = i < on ? (p > 0.7 ? C.red : p > 0.45 ? C.yellow : C.green) : "rgba(31,97,53,.4)";
    ctx.fillRect(i*(bw+gap), H-BAR_H+2, bw, BAR_H-4);
  }
  if(barShown > 0.7){
    ctx.fillStyle = "rgba(255,90,77,.13)";
    ctx.fillRect(0, CAM_Y, W, CAM_S);
  }
}
function drawWatermark(){
  ctx.save();
  ctx.font = '20px ' + HEADEN; ctx.textAlign = "right"; ctx.textBaseline = "bottom";
  ctx.fillStyle = "#03110A"; ctx.fillText("DON'T SMILE", W-24+3, H-BAR_H-18+3);
  ctx.fillStyle = C.yellow;  ctx.fillText("DON'T SMILE", W-24,   H-BAR_H-18);
  ctx.restore();
}
function drawTimer(now){
  const el = (now - playStart)/1000;
  const s  = el.toFixed(1) + T("secShort");
  ctx.save();
  ctx.font = '77px '+HEAD; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillStyle = "#03110A"; ctx.fillText(s, 26+7, 578+7);
  ctx.fillStyle = C.yellow;  ctx.fillText(s, 26,   578);
  ctx.restore();
}

/* 카메라 창을 옛날 모니터처럼 */
function camFrame(now){
  const y = CAM_Y, w = CAM_S, h = CAM_S;
  ctx.save();
  ctx.fillStyle = "rgba(3,17,10,.20)";
  for(let i=0;i<h;i+=4) ctx.fillRect(0, y+i, w, 2);
  ctx.restore();
  ctx.fillStyle = C.line;
  ctx.fillRect(0, y, w, 8); ctx.fillRect(0, y+h-8, w, 8);
  ctx.fillRect(0, y, 8, h); ctx.fillRect(w-8, y, 8, h);
  const L = 52, T2 = 12;
  ctx.fillStyle = C.yellow;
  ctx.fillRect(0, y, L, T2);          ctx.fillRect(0, y, T2, L);
  ctx.fillRect(w-L, y, L, T2);        ctx.fillRect(w-T2, y, T2, L);
  ctx.fillRect(0, y+h-T2-BAR_H, L, T2);     ctx.fillRect(0, y+h-L-BAR_H, T2, L);
  ctx.fillRect(w-L, y+h-T2-BAR_H, L, T2);   ctx.fillRect(w-T2, y+h-L-BAR_H, T2, L);
  if(Math.floor(now/520) % 2){
    ctx.fillStyle = C.red; ctx.fillRect(w-150, y+34, 20, 20);
    ctx.save();
    ctx.font = '24px '+HEADEN; ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillStyle = "#03110A"; ctx.fillText("REC", w-118+3, y+34+3);
    ctx.fillStyle = C.cream;  ctx.fillText("REC", w-118,   y+34);
    ctx.restore();
  }
}
function drawHud(now){
  drawTimer(now);
  const goneFor = now - lastFaceAt;
  if(goneFor > 420){
    const left = Math.max(0,(PLAY_NOFACE_MS-goneFor)/1000);
    const a = 0.55 + 0.45*Math.sin(now/90);
    ctx.fillStyle = "rgba(255,90,77,"+(0.16*a)+")"; ctx.fillRect(0,CAM_Y,W,CAM_S);
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = '44px ' + HEAD;
    ctx.fillStyle = "#03110A"; ctx.fillText(T("cd_noface"), 360+5, 950+5);
    ctx.fillStyle = C.red;     ctx.fillText(T("cd_noface"), 360,   950);
    ctx.font = '44px ' + HEADEN;
    ctx.fillStyle = "#03110A"; ctx.fillText(left.toFixed(1), 360+5, 1030+5);
    ctx.fillStyle = C.cream;   ctx.fillText(left.toFixed(1), 360,   1030);
    ctx.restore();
  }
  drawTensionBar();
  drawWatermark();
}

function renderPlay(now, dt){
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);
  drawStim(now, dt);
  const el = now - playStart;
  if(el < 700){
    const a = 1 - el/700;
    const sz = 132 + (1-a)*30;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = sz + 'px ' + HEADEN; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#03110A"; ctx.fillText("GO!", 360+8, 280+8);
    ctx.fillStyle = C.yellow;  ctx.fillText("GO!", 360,   280);
    ctx.restore();
  }
  if(!drawCam(ctx, 0, CAM_Y, CAM_S, CAM_S, 1, true)){
    ctx.fillStyle = C.panel; ctx.fillRect(0, CAM_Y, W, CAM_S);
  }
  camFrame(now);
  drawHud(now);
}

function renderCountdown(now){
  ctx.fillStyle = C.bg;    ctx.fillRect(0,0,W,H);
  ctx.fillStyle = C.panel; ctx.fillRect(0,0,W,SR_H);
  /* 픽셀 격자 */
  ctx.fillStyle = "rgba(76,224,91,.07)";
  for(let x=0;x<W;x+=24) ctx.fillRect(x, 0, 2, SR_H);
  for(let y=0;y<SR_H;y+=24) ctx.fillRect(0, y, W, 2);

  const left = Math.max(0, CD_MS - (now - cdStart));
  const num  = Math.max(1, Math.ceil(left/1000));
  const frac = 1 - ((left % 1000)/1000);
  const pop  = 1 + (1 - easeOut(Math.min(1, frac*3)))*0.28;

  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = Math.round(150*pop) + 'px ' + HEADEN;
  ctx.fillStyle = "#03110A";                       ctx.fillText(String(num), 360+9, 196+9);
  ctx.fillStyle = noFace ? C.red : C.yellow;       ctx.fillText(String(num), 360,   196);
  ctx.restore();

  /* 블록 진행바 */
  const ring = 1 - left/CD_MS, N = 20, gap = 6, bw = (560 - gap*(N-1))/N;
  const on = Math.round(ring*N);
  for(let i=0;i<N;i++){
    ctx.fillStyle = i < on ? (noFace ? C.red : C.green) : "rgba(31,97,53,.45)";
    ctx.fillRect(80 + i*(bw+gap), 336, bw, 16);
  }

  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if(noFace){
    ctx.font = '40px ' + HEAD;
    ctx.fillStyle = "#03110A"; ctx.fillText(T("cd_noface"), 360+4, 420+4);
    ctx.fillStyle = C.red;     ctx.fillText(T("cd_noface"), 360,   420);
  }else{
    ctx.font = '22px ' + HEAD; ctx.fillStyle = C.muted;
    ctx.fillText(T("cd_calib"), 360, 406);
    const fs = fitFont(T("cd_hold"), 620, HEAD, 26);
    ctx.font = Math.round(fs) + 'px ' + HEAD; ctx.fillStyle = C.cream;
    ctx.fillText(T("cd_hold"), 360, 452);
  }
  ctx.font = '20px ' + HEAD; ctx.fillStyle = C.muted;
  ctx.fillText(diffName() + " · " + sens().toFixed(2), 360, 508);
  ctx.restore();

  drawCam(ctx, 0, CAM_Y, CAM_S, CAM_S, 1, true);
  camFrame(now);
  /* 얼굴 가이드 */
  ctx.save();
  ctx.strokeStyle = noFace ? C.red : "rgba(255,216,77,.75)";
  ctx.lineWidth = 6; ctx.setLineDash([18, 14]);
  ctx.beginPath(); ctx.ellipse(360, 900, 208, 264, 0, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
  drawWatermark();
}

function renderLoading(now){
  ctx.fillStyle = C.bg;    ctx.fillRect(0,0,W,H);
  ctx.fillStyle = C.panel; ctx.fillRect(0,0,W,SR_H);
  ctx.fillStyle = "rgba(76,224,91,.07)";
  for(let x=0;x<W;x+=24) ctx.fillRect(x, 0, 2, SR_H);
  for(let y=0;y<SR_H;y+=24) ctx.fillRect(0, y, W, 2);

  /* 돌아가는 블록 */
  const N = 12, step = Math.floor(now/90) % N;
  for(let i=0;i<N;i++){
    const a = i/N*Math.PI*2 - Math.PI/2;
    const lit = ((i - step + N) % N) < 4;
    ctx.fillStyle = lit ? C.yellow : "rgba(31,97,53,.5)";
    ctx.fillRect(Math.round(360 + Math.cos(a)*96) - 9, Math.round(214 + Math.sin(a)*96) - 9, 18, 18);
  }
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const fs = fitFont(T("prep"), 620, HEAD, 26);
  ctx.font = Math.round(fs) + 'px ' + HEAD; ctx.fillStyle = C.cream;
  ctx.fillText(T("prep"), 360, 390);
  ctx.font = '20px ' + HEAD; ctx.fillStyle = C.muted;
  ctx.fillText(diffName() + " · " + sens().toFixed(2), 360, 442);
  ctx.restore();

  drawCam(ctx, 0, CAM_Y, CAM_S, CAM_S, 1, true);
  camFrame(now);
  drawWatermark();
}

function drawFail(now){
  const p = clamp((now - failStart)/FAIL_MS, 0, 1);
  /* 스냅샷의 카메라 영역만 9:16 커버 크롭으로 채우며 천천히 푸시인 */
  const z  = 1 + 0.17*easeOut(p);
  const sh = 720/z, sw = sh*(720/1280), sx = (720-sw)/2, sy = CAM_Y + (720-sh)/2;
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);
  if(snapCv){ try{ ctx.drawImage(snapCv, sx, sy, sw, sh, 0, 0, W, H); }catch(e){} }

  /* 빨간 플래시가 빠르게 사라짐 */
  /* 주사선 */
  ctx.save(); ctx.fillStyle = "rgba(3,17,10,.18)";
  for(let i=0;i<H;i+=4) ctx.fillRect(0, i, W, 2);
  ctx.restore();
  const fa = Math.max(0, 1 - p/0.2)*0.92;
  if(fa > 0){ ctx.fillStyle = "rgba(255,90,77,"+fa+")"; ctx.fillRect(0,0,W,H); }

  /* 하단 400px 그라디언트 슬랩 */
  const g = ctx.createLinearGradient(0, H-400, 0, H);
  g.addColorStop(0,   "rgba(11,36,21,0)");
  g.addColorStop(0.42,"rgba(11,36,21,.92)");
  g.addColorStop(1,   "rgba(11,36,21,.99)");
  ctx.fillStyle = g; ctx.fillRect(0, H-400, W, 400);
  ctx.fillStyle = C.line; ctx.fillRect(0, H-400, W, 6);

  const rise = easeOut(clamp((p-0.05)/0.32, 0, 1));
  ctx.save();
  ctx.globalAlpha = rise;
  ctx.translate(0, (1-rise)*34);

  const esc = failReason === "escape";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  const label = esc ? T("failEsc") : T("fail");
  ctx.font = '56px ' + HEAD;
  ctx.fillStyle = "#03110A"; ctx.fillText(label, 360+6, 962+6);
  ctx.fillStyle = C.red;     ctx.fillText(label, 360,   962);

  const secTxt = (finalMs/1000).toFixed(1) + "s";
  const fs = fitFont(secTxt, 600, HEADEN, 104);
  ctx.font = Math.round(fs) + 'px ' + HEADEN;
  ctx.fillStyle = "#03110A"; ctx.fillText(secTxt, 360+8, 1078+8);
  ctx.fillStyle = C.yellow;  ctx.fillText(secTxt, 360,   1078);

  const sub = esc ? T("escNote") : gradeOf(finalMs/1000);
  const ss2 = fitFont(sub, 620, HEAD, 26);
  ctx.font = Math.round(ss2) + 'px ' + HEAD; ctx.fillStyle = C.green;
  ctx.fillText(sub, 360, 1170);

  ctx.font = '20px ' + HEADEN; ctx.fillStyle = C.muted;
  ctx.fillText("DON'T SMILE", 360, 1232);
  ctx.restore();

  if(p >= 1 && !failDone){ failDone = true; finishFail(); }
}

   7. 게임 상태 머신
   ============================================================ */
let phase = "idle";            // idle | countdown | play | fail | done
let diff  = "normal";
let cdStart = 0, cdSamples = [], base = 0, noFace = false;
let playStart = 0, overSince = 0;
let failStart = 0, failReason = "laugh", finalMs = 0, failDone = false, snapCv = null;
let raf = 0, lastT = 0;

function median(a){
  if(!a.length) return 0;
  const b = a.slice().sort((x,y)=>x-y), n = b.length;
  return n % 2 ? b[(n-1)>>1] : (b[n/2-1]+b[n/2])/2;
}
function gradeOf(sec){
  const g = STR[LANG].grades;
  for(const x of g) if(sec < x.t) return x.s;
  return g[g.length-1].s;
}

function beginCountdown(){
  phase = "countdown";
  const now = performance.now();
  cdStart = now; cdSamples = []; noFace = false;
  base = 0; curScore = 0; faceSeen = false; lastFaceAt = now; lastVideoTime = -1;
  bag = []; curStim = null; barShown = 0; failDone = false; snapCv = null;
  lastT = now;
  if(!raf) raf = requestAnimationFrame(loop);
}
function stepCountdown(now){
  /* 얼굴이 0.8초 이상 안 보이면 카운트다운 리셋 (base가 0으로 잡히는 것 방지) */
  if(now - lastFaceAt > CD_NOFACE_MS){
    cdStart = now; cdSamples.length = 0; noFace = true;
    return;
  }
  if(faceSeen){ noFace = false; cdSamples.push(curScore); }
  if(now - cdStart >= CD_MS){
    if(cdSamples.length < MIN_SAMPLES){   // 샘플이 모자라면 base를 믿을 수 없다 → 다시
      cdStart = now; cdSamples.length = 0; noFace = true; return;
    }
    base = median(cdSamples);
    beginPlay(now);
  }
}
function beginPlay(now){
  phase = "play";
  playStart = now; overSince = 0; lastFaceAt = now; barShown = 0;
  nextStim(now);
  startRecording();                       // 카운트다운이 끝나는 순간 녹화 시작
  sfx("slide", 0.7);
}
function judge(now){
  /* 게임 중 얼굴이 1.3초 이상 안 보이면 '도망'으로 실패 */
  if(now - lastFaceAt > PLAY_NOFACE_MS){ triggerFail(now, "escape"); return; }
  if((curScore - base) > sens()){
    if(!overSince) overSince = now;
    else if(now - overSince >= HOLD_MS) triggerFail(now, "laugh");
  }else{
    overSince = 0;
  }
}
function triggerFail(now, reason){
  if(phase !== "play") return;
  phase = "fail"; failReason = reason; failStart = now; failDone = false;
  finalMs = Math.max(0, now - playStart);
  failJoke = joke;
  if(reason === "laugh" && joke && joke[3]) DRIP.laugh(joke[3]);
  snapCv = document.createElement("canvas");
  snapCv.width = W; snapCv.height = H;
  try{ snapCv.getContext("2d").drawImage(stage, 0, 0); }catch(e){ snapCv = null; }
  sfx("boom", 1);
  setTimeout(()=>sfx("slide", 0.45), 110);
}
function finishFail(){
  phase = "done";
  if(raf){ cancelAnimationFrame(raf); raf = 0; }
  if(recorder && recorder.state === "recording"){
    setTimeout(onRecordingDone, 3000);            // onstop이 오지 않는 경우 대비
    try{ recorder.stop(); }catch(e){ onRecordingDone(); }
  }else{
    onRecordingDone();
  }
}

function loop(now){
  raf = requestAnimationFrame(loop);
  let dt = (now - lastT)/1000; lastT = now;
  if(!(dt > 0) || dt > 0.08) dt = 0.016;

  pollFace(now);

  if(phase === "loading"){ renderLoading(now); return; }
  if(phase === "countdown"){ stepCountdown(now); }
  if(phase === "countdown"){ renderCountdown(now); return; }
  if(phase === "play"){ renderPlay(now, dt); judge(now); return; }
  if(phase === "fail"){ drawFail(now); return; }
}

let mediaStream=null, capStream=null, recorder=null, recMime="", chunks=[], recBlob=null, resURL=null, resultShown=false;

function pickMime(){
  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
  const list = [
    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',   // 인스타그램은 webm을 안 받는다 → mp4 우선
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm'
  ];
  for(const m of list){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return "";
}
function setupRecorder(){
  recorder = null; chunks = []; recBlob = null; recMime = "";
  if(!window.MediaRecorder || !stage.captureStream) return;
  try{ capStream = stage.captureStream(30); }catch(e){ capStream = null; return; }
  const tracks = capStream.getVideoTracks().slice();
  if(recDest && recDest.stream.getAudioTracks().length) tracks.push(recDest.stream.getAudioTracks()[0]);
  const mixed = new MediaStream(tracks);
  const m = pickMime();
  try{
    recorder = m ? new MediaRecorder(mixed, { mimeType:m, videoBitsPerSecond:5000000, audioBitsPerSecond:128000 })
                 : new MediaRecorder(mixed);
  }catch(e){
    try{ recorder = new MediaRecorder(mixed); }catch(e2){ recorder = null; return; }
  }
  recMime = recorder.mimeType || m || "video/webm";
  recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    recBlob = chunks.length ? new Blob(chunks, { type: recMime.split(";")[0] }) : null;
    onRecordingDone();
  };
  recorder.onerror = () => { onRecordingDone(); };
}
function startRecording(){
  if(recorder && recorder.state === "inactive"){
    try{ recorder.start(); }catch(e){ recorder = null; }
  }
}
function stopMedia(){
  try{ if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ if(capStream) capStream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ cam.pause(); cam.srcObject = null; }catch(e){}
  try{ if(micNode) micNode.disconnect(); }catch(e){}
  mediaStream = null; capStream = null; micNode = null;
}
function onRecordingDone(){
  if(resultShown) return;
  resultShown = true;
  stopMedia();
  showResult();
}

function waitVideo(){
  return new Promise(res=>{
    const t0 = performance.now();
    (function tick(){
      if(cam.videoWidth && cam.readyState >= 2) return res(true);
      if(performance.now()-t0 > 6000) return res(false);
      requestAnimationFrame(tick);

  });

async function getStream(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    const err = new Error("getUserMedia unavailable (HTTPS required)");
    err.name = "SecurityError"; throw err;
  }
  const v = { facingMode:"user", width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30} };
  try{
    return await navigator.mediaDevices.getUserMedia({ video:v, audio:true });
  }catch(e){
    /* 마이크가 없거나 차단돼 있으면 카메라+마이크 동시 요청은 팝업조차 없이
       NotAllowedError 로 죽는다. 카메라만으로 한 번 더 시도한다. */
    console.warn("[gum] video+audio failed:", e && e.name, e && e.message);
    try{
      const s2 = await navigator.mediaDevices.getUserMedia({ video:v, audio:false });
      micDenied = true;
      return s2;
    }catch(e2){
      console.warn("[gum] video-only failed:", e2 && e2.name, e2 && e2.message);
      throw (e2 && e2.name === "NotAllowedError") ? e : e2;
    }
  }
}
async function showCamError(e){
  const n = (e && e.name) || "";
  let key;
  if(n === "NotFoundError" || n === "OverconstrainedError" || n === "DevicesNotFoundError") key = "err_nodev";
  else if(n === "NotReadableError" || n === "AbortError" || n === "TrackStartError")        key = "err_busy";
  else if(n === "NotAllowedError" || n === "PermissionDeniedError")                          key = "err_denied";
  else if(n === "SecurityError" || window.isSecureContext === false)                         key = "err_insecure";
  else key = "";

  /* 브라우저에 '차단'으로 저장돼 있으면 팝업 자체가 안 뜬다 → 그에 맞는 안내 */
  if(key === "err_denied" && navigator.permissions && navigator.permissions.query){
    try{
      const st = await navigator.permissions.query({ name:"camera" });
      if(st && st.state === "denied") key = "err_blocked";
    }catch(err){}
  }
  /* 다른 사이트에 iframe 으로 박혀 있으면 allow="camera" 없이는 무조건 막힌다 */
  if((key === "err_denied" || key === "err_blocked") && inFrame()) key = "err_iframe";

  lastErr = n || "unknown";
  console.error("[camera]", n, e);
  if(key) setStartNote(key, true);
  else{
    setStartNote("", true);
    startNote.textContent = T("err_generic") + (n ? n + ": " : "") + ((e && e.message) || e);
    startNote.classList.add("warn");
  }
  renderDiag();
  startBtn.disabled = false;
  show("scr-start");
}

async function start(){
  /* 여기서 무슨 예외가 나든 화면에 보이게 한다 (조용히 아무 일도 안 일어나는 것 방지) */
  try{ await startInner(); }
  catch(e){
    lastErr = (e && e.name) || "boot";
    console.error("[start]", e);
    setStartNote("", true);
    startNote.textContent = T("err_boot") + ((e && (e.name+": "+e.message)) || e);
    startNote.classList.add("warn");

async function startInner(){
  if(phase === "loading" || phase === "countdown" || phase === "play" || phase === "fail") return;
  startBtn.disabled = true;
  lastErr = ""; micDenied = false;
  setTimeout(()=>{ if(phase === "idle") startBtn.disabled = false; }, 8000);  // 팝업이 안 뜨면 다시 누를 수 있게
  resultShown = false; recBlob = null; chunks = [];
  setStartNote("asking");

  /* ── 여기부터 첫 await 전까지는 클릭 제스처(user activation)가 살아 있다 ──
     getUserMedia 를 await 뒤로 미루면 Safari/iOS 는 권한 팝업조차 띄우지 않고
     바로 NotAllowedError 를 던진다. 모델 로딩은 권한을 받은 뒤에 한다. */
  unlockAudio();
  const streamP = getStream();
  /* ──────────────────────────────────────────────────────────────────── */

  let stream;
  try{ stream = await streamP; }
  catch(e){ await showCamError(e); return; }

  mediaStream = stream;
  cam.srcObject = stream;
  cam.muted = true; cam.playsInline = true;
  try{ await cam.play(); }catch(e){}

  /* 카메라 미리보기를 먼저 띄워 두고 그 뒤에서 모델/폰트를 받는다 */
  phase = "loading";
  show("scr-game");
  startBtn.disabled = false;
  lastT = performance.now();
  if(!raf) raf = requestAnimationFrame(loop);

  await waitVideo();
  if(phase !== "loading") return;

  await fontsReady();               // 웹폰트가 준비돼야 캔버스 텍스트가 제대로 그려진다
  if(phase !== "loading") return;

  try{ await loadModel(); }
  catch(e){
    if(phase !== "loading") return;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    phase = "idle"; stopMedia();
    setStartNote("err_model", true);
    show("scr-start");
    return;
  }
  if(phase !== "loading") return;

  initAudio(stream);
  setupRecorder();
  setStartNote(micDenied ? "noMic" : "ready");
  refreshPerm();
pingApi().then(loadFeed).then(renderMyDrips);
  beginCountdown();
}

let failJoke  = null;      // 무너진 순간 떠 있던 개그

async function api(path, opts){
  const r = await fetch("/api/" + path, Object.assign({ headers:{ "content-type":"application/json" } }, opts || {}));
  let data = null;
  try{ data = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
  return data || {};
}
async function pingApi(){
  try{ await api("ping"); apiOn = true; }
  catch(e){ apiOn = false; }
  renderDiag();
  return apiOn;
}
function apiDown(){ apiOn = false; renderDiag(); }

/* 서버가 없을 때 쓰는 기기 내 저장소 */
const localJokes       = ()=> LS.get("dl_jokes", []);
const setLocalJokes    = a => LS.set("dl_jokes", a);
const localComments    = ()=> LS.get("dl_comments", {});
const setLocalComments = o => LS.set("dl_comments", o);

const DRIP = {
  async feed(){
    if(apiOn){
      try{ return (await api("feed?lang=" + LANG + "&limit=40")).jokes || []; }
      catch(e){ apiDown(); }
    }
    return localJokes().filter(j => j.lang === LANG);
  },
  async submit(j){
    if(apiOn){
      const r = await api("jokes", { method:"POST", body: JSON.stringify(Object.assign({ author:ME }, j)) });
      return { id:r.id, remote:true };
    }
    const arr = localJokes();
    const id  = arr.reduce((m,x)=>Math.max(m, x.id || 0), 0) + 1;
    arr.unshift(Object.assign({ id, laughs:0, created:Date.now() }, j));
    setLocalJokes(arr);
    return { id, remote:false };
  },
  async mine(){
    if(apiOn){
      try{ return (await api("mine?author=" + encodeURIComponent(ME))).jokes || []; }
      catch(e){ apiDown(); }
    }
    const cm = localComments();
    return localJokes().map(j => {
      const list = cm["u" + j.id] || [];
      return Object.assign({}, j, {
        comments: list.length,
        last_comment: list.length ? list[list.length-1].id : 0
      });
    });
  },
  async comments(target){
    if(apiOn){
      try{ return (await api("comments?target=" + encodeURIComponent(target))).comments || []; }
      catch(e){ apiDown(); }
    }
    return (localComments()[target] || []).slice().reverse();
  },
  async comment(target, body){
    if(apiOn){
      await api("comments", { method:"POST", body: JSON.stringify({ target, body, nick:myNick, author:ME }) });
      return true;
    }
    const cm = localComments();
    const list = cm[target] || (cm[target] = []);
    list.push({ id:list.length + 1, body, nick:myNick, created:Date.now() });
    setLocalComments(cm);
    return false;
  },
  async remove(id){
    if(apiOn){ await api("delete", { method:"POST", body: JSON.stringify({ id, author:ME }) }); return; }
    setLocalJokes(localJokes().filter(j => j.id !== id));
    const cm = localComments(); delete cm["u" + id]; setLocalComments(cm);
  },
  async laugh(target){
    if(!apiOn) return;
    try{ await api("laugh", { method:"POST", body: JSON.stringify({ target }) }); }catch(e){}
  }
};

async function loadFeed(){
  try{ userJokes = await DRIP.feed(); }catch(e){ userJokes = []; }
}

/* ---------- 표시 ---------- */
function fmtWhen(ts){
  const d = Math.max(0, Date.now() - (ts || 0));
  const m = Math.floor(d/60000), h = Math.floor(m/60), day = Math.floor(h/24);
  if(LANG === "ko") return day ? day + "일 전" : h ? h + "시간 전" : m ? m + "분 전" : "방금";
  return day ? day + "d ago" : h ? h + "h ago" : m ? m + "m ago" : "just now";
}
function renderComments(box, list){
  box.innerHTML = "";
  if(!list.length){
    const p = document.createElement("p");
    p.className = "tiny"; p.textContent = T("noComments");
    box.appendChild(p); return;
  }
  for(const c of list){
    const el = document.createElement("div"); el.className = "cm";
    const b  = document.createElement("div"); b.className = "cmbody"; b.textContent = c.body;
    const m  = document.createElement("div"); m.className = "cmmeta";
    m.textContent = (c.nick || T("anon")) + " · " + fmtWhen(c.created);
    el.appendChild(b); el.appendChild(m); box.appendChild(el);
  }
}
function updateDripBadge(){
  const seen = LS.get("dl_seen", {});
  let unread = 0;
  for(const j of myDrips) if((j.last_comment || 0) > (seen["u" + j.id] || 0)) unread++;
  const badge = $("#dripBadge");
  if(badge){ badge.hidden = !unread; badge.textContent = String(unread); }
  const sub = $("#dripSub");
  if(sub) sub.textContent = myDrips.length ? STR[LANG].dripSub(myDrips.length, unread) : T("dripSubNone");
}
async function renderMyDrips(){
  const box = $("#myList");
  if(!box) return;
  try{ myDrips = await DRIP.mine(); }catch(e){ myDrips = []; }
  const seen = LS.get("dl_seen", {});
  box.innerHTML = "";
  if(!myDrips.length){
    const p = document.createElement("p");
    p.className = "tiny"; p.textContent = T("noDrips");
    box.appendChild(p); updateDripBadge(); return;
  }
  for(const j of myDrips){
    const target = "u" + j.id;
    const row  = document.createElement("div"); row.className = "drow";
    const head = document.createElement("button"); head.className = "dhead"; head.type = "button";
    const q = document.createElement("div"); q.className = "dq"; q.textContent = j.setup;
    const a = document.createElement("div"); a.className = "da";
    a.textContent = (j.emoji ? j.emoji + " " : "") + j.punch;
    const meta = document.createElement("div"); meta.className = "dmeta";
    meta.textContent = STR[LANG].laughs(j.laughs || 0) + " · " + STR[LANG].cmCount(j.comments || 0);
    head.appendChild(q); head.appendChild(a); head.appendChild(meta);
    if((j.last_comment || 0) > (seen[target] || 0)){
      const dot = document.createElement("span"); dot.className = "dot"; row.appendChild(dot);
    }
    const panel = document.createElement("div"); panel.className = "cmlist"; panel.hidden = true;
    head.addEventListener("click", async ()=>{
      panel.hidden = !panel.hidden;
      if(panel.hidden) return;
      panel.textContent = "…";
      let list = [];
      try{ list = await DRIP.comments(target); }catch(e){}
      renderComments(panel, list);
      const sn = LS.get("dl_seen", {});
      sn[target] = j.last_comment || 0;
      LS.set("dl_seen", sn);
      const dot = row.querySelector(".dot"); if(dot) dot.remove();
      updateDripBadge();
    });
    const del = document.createElement("button");
    del.className = "dellink"; del.type = "button"; del.textContent = T("del");
    del.addEventListener("click", async ()=>{
      try{ await DRIP.remove(j.id); }catch(e){ dNote(String(e.message || e), true); return; }
      await loadFeed(); await renderMyDrips();
    });
    row.appendChild(head); row.appendChild(panel); row.appendChild(del);
    box.appendChild(row);
  }
  updateDripBadge();
}
function dNote(msg, warn){
  const el = $("#dNote");
  if(!el) return;
  el.textContent = msg || "";
  el.classList.toggle("warn", !!warn);
}
async function submitDrip(){
  const setup = $("#dSetup").value.trim();
  const punch = $("#dPunch").value.trim();
  const emoji = $("#dEmoji").value.trim();
  const nick  = $("#dNick").value.trim();
  if(!setup || !punch){ dNote(T("needBoth"), true); return; }
  myNick = nick; LS.set("dl_nick", nick);
  const btn = $("#dSubmit"); btn.disabled = true;
  try{
    const r = await DRIP.submit({ setup, punch, emoji, nick, lang:LANG });
    $("#dSetup").value = ""; $("#dPunch").value = ""; $("#dEmoji").value = "";
    dNote(r.remote ? T("dripOk") : T("dripLocal"), !r.remote);
    await loadFeed();
    await renderMyDrips();
  }catch(e){
    dNote(String((e && e.message) || e), true);
  }
  btn.disabled = false;
}

/* ---------- 결과 화면: 나를 무너뜨린 개그 ---------- */
function renderJokeCard(){
  const card = $("#jokeCard");
  if(!card) return;
  if(!failJoke){ card.hidden = true; return; }
  card.hidden = false;
  $("#jkSetup").textContent = failJoke[0] || "";
  $("#jkEmoji").textContent = failJoke[2] || "";
  $("#jkPunch").textContent = failJoke[1] || "";
  $("#jkBy").textContent    = failJoke[4] ? "— " + failJoke[4] : "";
  $("#jkInput").value = "";
  const box = $("#jkComments");
  box.innerHTML = "";
  DRIP.comments(failJoke[3]).then(list => renderComments(box, list)).catch(()=>{});
}
async function sendJokeComment(){
  if(!failJoke) return;
  const input = $("#jkInput");
  const body = input.value.trim();
  if(!body) return;
  const btn = $("#jkSend"); btn.disabled = true;
  try{
    await DRIP.comment(failJoke[3], body);
    input.value = "";
    const list = await DRIP.comments(failJoke[3]);
    renderComments($("#jkComments"), list);
    setResNote(apiOn ? "cmOk" : "cmLocal");
  }catch(e){
    resNote.textContent = String((e && e.message) || e);
    resNote.classList.add("warn");
  }
  btn.disabled = false;
}

/* 16x16 도트 스마일 */
function pixelSmiley(size, fill, ink){
  const N = 16, cell = size/N, cx = 7.5, cy = 7.5, R = 7.7;
  let out = "";
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const d = Math.sqrt((x-cx)*(x-cx) + (y-cy)*(y-cy));
    if(d > R) continue;
    let c = fill;
    if(d > R - 1.25) c = ink;                                  // 테두리
    if((x === 5 || x === 10) && y >= 4 && y <= 6) c = ink;      // 눈
    if(y === 10 && x >= 5 && x <= 10) c = ink;                  // 입
    if(y === 9 && (x === 4 || x === 11)) c = ink;               // 올라간 입꼬리
    out += '<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'" fill="'+c+'"/>';
  }
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" '
       + 'shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">' + out + '</svg>';
}

/* 친구에게 링크 보내기 */
function shareURL(){
  /* origin/pathname 이 없는 환경도 있어 href 로 만든다 (쿼리·해시는 떼고) */
  try{
    const u = new URL(location.href);
    u.search = ""; u.hash = "";
    return u.href;
  }catch(e){
    return String((location && location.href) || "");
  }
}
async function inviteFriend(note){
  const url = shareURL();
  const text = STR[LANG].inviteText;
  if(navigator.share){
    try{ await navigator.share({ title:"DON'T SMILE", text, url }); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  try{
    await navigator.clipboard.writeText(text + "\n" + url);
    note("linkCopied", false);
  }catch(e){
    note("linkFail", true);
  }
}

const QUICK_EMO = ["🥫","🧂","🦍","🥩","🥛","🐦","🍑","🌀","🍞","🍓","🐔","🐙","⭐","🐜","⏳","🍩","🍺","🥶","🐮","🦁","🐰","🧁"];
function buildEmoRow(){
  const row = $("#emoRow");
  if(!row || row.children.length) return;
  for(const e of QUICK_EMO){
    const b = document.createElement("button");
    b.type = "button"; b.className = "emobtn"; b.textContent = e;
    b.addEventListener("click", ()=>{ $("#dEmoji").value = e; });
    row.appendChild(b);
  }
}

function applyI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = T(el.dataset.i); });
  document.querySelectorAll("[data-ih]").forEach(el => { el.innerHTML = T(el.dataset.ih); });
  document.querySelectorAll("[data-ph]").forEach(el => { el.placeholder = T(el.dataset.ph); });
  langBtn.textContent = LANG === "ko" ? "EN" : "한국어";
  startNote.textContent = startNoteKey ? T(startNoteKey) : "";
  startNote.classList.toggle("warn", startNoteWarn);
  resNote.textContent = resNoteKey ? T(resNoteKey) : "";
  const miss = $("#vidMiss"); if(miss) miss.textContent = T("noRec");
  tierDesc();
  updateDripBadge();
  renderDiag();
  if($("#scr-result").classList.contains("on")) renderResultTexts();
  document.title = "DON'T SMILE";
}
langBtn.addEventListener("click", async ()=>{
  LANG = LANG === "ko" ? "en" : "ko";
  applyI18n();
  await loadFeed();
  if($("#scr-drip").classList.contains("on")) await renderMyDrips();
  else updateDripBadge();
});
