<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>안 웃기 챌린지 · Don't Laugh Challenge</title>
<meta name="theme-color" content="#0B1F1D">
<meta name="description" content="웹캠으로 웃음을 감지하는 안 웃기 챌린지. 버틴 시간을 재고 무너지는 순간을 9:16 영상으로 남깁니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --deep:#0B1F1D;
  --panel:#12302C;
  --line:#1E4740;
  --amber:#FFB020;
  --red:#FF3B2F;
  --cream:#F5EEDD;
  --muted:#7A9490;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--deep);
  color:var(--cream);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;height:100dvh;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
.wrap{
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  gap:20px;max-width:600px;margin:0 auto;
  padding:calc(var(--st) + 30px) calc(var(--sr) + 22px) calc(var(--sb) + 30px) calc(var(--sl) + 22px);
}

/* ---------- start ---------- */
.lang{
  position:absolute;top:calc(var(--st) + 14px);right:calc(var(--sr) + 16px);
  border:1px solid var(--line);background:rgba(18,48,44,.7);
  color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;
  padding:8px 13px;border-radius:999px;z-index:5;
}
.lang:hover{color:var(--cream);border-color:var(--amber)}
.kicker{
  font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--amber);
  text-transform:uppercase;margin-bottom:12px;
}
.title{
  font-family:"Black Han Sans",sans-serif;font-weight:400;
  font-size:clamp(52px,16vw,88px);line-height:.92;letter-spacing:-.01em;
  margin:0 0 16px;color:var(--cream);
}
.title em{font-style:normal;color:var(--amber)}
.lead{margin:0;font-size:15px;line-height:1.72;color:var(--muted);max-width:36ch}
.lead b{color:var(--cream);font-weight:700}

.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.tier{
  display:flex;flex-direction:column;gap:6px;align-items:flex-start;
  border:1.5px solid var(--line);background:var(--panel);
  border-radius:15px;padding:14px 12px 13px;text-align:left;
  transition:border-color .15s,background .15s,transform .1s;
}
.tier:active{transform:scale(.975)}
.tier .tn{font-family:"Black Han Sans",sans-serif;font-size:20px;line-height:1;color:var(--cream)}
.tier .td{font-size:11px;line-height:1.45;color:var(--muted);word-break:keep-all}
.tier .tv{
  font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-top:auto;
}
.tier[aria-pressed="true"]{border-color:var(--amber);background:rgba(255,176,32,.11)}
.tier[aria-pressed="true"] .tn{color:var(--amber)}
.tier[aria-pressed="true"] .tv{color:var(--amber);border-color:rgba(255,176,32,.5)}

.cta{
  display:block;width:100%;background:var(--amber);color:#0B1F1D;
  font-family:"Black Han Sans",sans-serif;font-size:24px;line-height:1;
  padding:21px 20px;border-radius:17px;
  box-shadow:0 10px 0 -2px rgba(255,176,32,.22);
  transition:transform .1s,opacity .15s;
}
.cta:active{transform:translateY(2px)}
.cta[disabled]{opacity:.45;cursor:default;transform:none}
.ghost{
  border:1.5px solid var(--line);background:var(--panel);color:var(--cream);
  font-size:14px;font-weight:700;padding:15px 12px;border-radius:14px;
  transition:border-color .15s,transform .1s;
}
.ghost:active{transform:scale(.975)}
.ghost:hover{border-color:var(--amber)}

.memebox{border:1.5px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.memehead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.memelabel{font-family:"Black Han Sans",sans-serif;font-size:17px;color:var(--cream)}
.memecount{font-size:11.5px;color:var(--muted);text-align:right}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.thumbs:empty{display:none}
.thumbs img{width:46px;height:46px;object-fit:cover;border-radius:9px;border:1px solid var(--line);flex:0 0 auto;background:var(--deep)}
.memebtns{display:grid;grid-template-columns:1fr auto;gap:8px}
.memebtns .ghost{padding:11px 14px;font-size:13px}
#picker{display:none}
.note{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted);min-height:1.6em}
.note.warn{color:var(--red);font-weight:700}
.tiny{margin:0;font-size:11px;line-height:1.6;color:rgba(122,148,144,.7)}
.diag{
  margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10.5px;line-height:1.5;letter-spacing:.02em;
  color:rgba(122,148,144,.55);word-break:break-all;user-select:all;
}
.diag.bad{color:var(--red)}

/* ---------- game ---------- */
#scr-game{background:var(--deep)}
.stagewrap{
  position:fixed;inset:0;display:grid;place-items:center;background:var(--deep);
  padding:var(--st) var(--sr) var(--sb) var(--sl);
}
#stage{
  display:block;aspect-ratio:9/16;height:100%;width:auto;
  max-width:100%;max-height:100%;background:var(--deep);
}

/* ---------- result ---------- */
.rescard{
  border:1.5px solid var(--line);background:var(--panel);
  border-radius:20px;padding:20px 20px 18px;text-align:center;
}
.reslabel{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.restime{
  font-family:"Black Han Sans",sans-serif;line-height:.95;color:var(--amber);
  font-size:clamp(58px,19vw,96px);margin:8px 0 4px;
}
.restime em{font-style:normal;font-size:.34em;color:var(--cream);margin-left:.12em}
.resgrade{font-family:"Black Han Sans",sans-serif;font-size:22px;line-height:1.3;color:var(--cream);word-break:keep-all}
.resmeta{margin-top:9px;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.vidwrap{display:grid;place-items:center}
#resVideo{
  width:auto;height:auto;max-height:46dvh;max-width:100%;aspect-ratio:9/16;
  border-radius:16px;background:var(--deep);border:1.5px solid var(--line);display:block;
}
.vidmiss{
  display:grid;place-items:center;text-align:center;padding:26px 18px;
  border:1.5px dashed var(--line);border-radius:16px;color:var(--muted);font-size:13px;line-height:1.6;
}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btns .cta{grid-column:1 / -1}

/* ---------- hidden cam ---------- */
#cam{position:fixed;left:-12px;top:-12px;width:4px;height:4px;opacity:.001;pointer-events:none;z-index:-1}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>

<!-- ================= START ================= -->
<section id="scr-start" class="screen on">
  <button id="langBtn" class="lang" type="button">EN</button>
  <div class="wrap">
    <header>
      <div class="kicker" data-i="kicker"></div>
      <h1 class="title" data-ih="title"></h1>
      <p class="lead" data-ih="lead"></p>
    </header>
    <div class="tiers" id="tiers">
      <button class="tier" type="button" data-diff="easy" aria-pressed="false">
        <span class="tn" data-i="t_easy"></span><span class="td" data-i="t_easy_d"></span><span class="tv">0.30</span>
      </button>
      <button class="tier" type="button" data-diff="normal" aria-pressed="true">
        <span class="tn" data-i="t_normal"></span><span class="td" data-i="t_normal_d"></span><span class="tv">0.19</span>
      </button>
      <button class="tier" type="button" data-diff="hard" aria-pressed="false">
        <span class="tn" data-i="t_hard"></span><span class="td" data-i="t_hard_d"></span><span class="tv">0.11</span>
      </button>
    </div>
    <div class="memebox">
      <div class="memehead">
        <span class="memelabel" data-i="memeTitle"></span>
        <span class="memecount" id="memeCount"></span>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <div class="memebtns">
        <button id="addMeme" class="ghost" type="button" data-i="addMeme"></button>
        <button id="clrMeme" class="ghost" type="button" data-i="clrMeme"></button>
      </div>
      <p class="tiny" data-i="memeHint"></p>
    </div>
    <input type="file" id="picker" accept="image/*" multiple>
    <button id="startBtn" class="cta" type="button" data-i="start"></button>
    <p class="note" id="startNote"></p>
    <p class="tiny" data-i="privacy"></p>
    <p class="diag" id="diag"></p>
  </div>
</section>

<!-- ================= GAME ================= -->
<section id="scr-game" class="screen">
  <div class="stagewrap"><canvas id="stage" width="720" height="1280"></canvas></div>
</section>

<!-- ================= RESULT ================= -->
<section id="scr-result" class="screen">
  <div class="wrap">
    <div class="rescard">
      <div class="reslabel" data-i="lasted"></div>
      <div class="restime"><span id="resTime">0.0</span><em data-i="sec"></em></div>
      <div class="resgrade" id="resGrade"></div>
      <div class="resmeta" id="resMeta"></div>
    </div>
    <div class="vidwrap" id="vidWrap">
      <video id="resVideo" playsinline controls loop></video>
    </div>
    <div class="btns">
      <button id="shareBtn" class="cta" type="button" data-i="share"></button>
      <button id="saveBtn" class="ghost" type="button" data-i="save"></button>
      <button id="againBtn" class="ghost" type="button" data-i="again"></button>
      <button id="homeBtn" class="ghost" type="button" data-i="home" style="grid-column:1 / -1"></button>
    </div>
    <p class="note" id="resNote"></p>
  </div>
</section>

/* ---- small helpers ---- */

const easeIn  = t=>t*t*t;
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function rrect(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function emo(c,ch,x,y,size,rot=0,sx=1,sy=1,alpha=1){
  c.save(); c.globalAlpha=alpha;
  c.translate(x,y); if(rot) c.rotate(rot); if(sx!==1||sy!==1) c.scale(sx,sy);
  c.font=size+"px "+EMOJI_FONT; c.textAlign="center"; c.textBaseline="middle";
  c.fillText(ch,0,0); c.restore();
}
function txt(c,s,x,y,font,fill,align="center",baseline="middle",stroke=null,lw=8){
  c.save(); c.font=font; c.textAlign=align; c.textBaseline=baseline;
  if(stroke){ c.lineWidth=lw; c.lineJoin="round"; c.miterLimit=2; c.strokeStyle=stroke; c.strokeText(s,x,y); }
  c.fillStyle=fill; c.fillText(s,x,y); c.restore();
}

/* ============================================================
   2. Web Audio — 효과음 실시간 생성 + 녹화용 오디오 믹스
   ============================================================ */
let ac=null, sfxBus=null, recDest=null, micNode=null, noiseBuffer=null;

function unlockAudio(){
  /* 여기서 예외가 새어 나가면 getUserMedia 까지 못 가고 아무 일도 안 일어난다 */
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!ac) ac = new AC();
    if(ac.state === "suspended") ac.resume();
  }catch(e){ console.warn("[audio]", e); }
}
function initAudio(micStream){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  if(!ac) ac = new AC();
  if(ac.state === "suspended") ac.resume();

  if(!sfxBus){
    sfxBus = ac.createGain();
    sfxBus.gain.value = 0.9;
    sfxBus.connect(ac.destination);          // 사용자 스피커
  }
  // 효과음 + 마이크를 하나의 MediaStreamDestination 으로 합쳐 녹화 오디오로 사용
  if(recDest){ try{ sfxBus.disconnect(recDest); }catch(e){} }
  recDest = ac.createMediaStreamDestination();
  sfxBus.connect(recDest);
  try{
    if(micStream && micStream.getAudioTracks().length){
      micNode = ac.createMediaStreamSource(micStream);
      const mg = ac.createGain(); mg.gain.value = 1.0;
      micNode.connect(mg);
      mg.connect(recDest);                   // 스피커로는 안 보냄(하울링 방지)
    }
  }catch(e){ /* 마이크 없으면 효과음만 녹음 */ }
}
function noiseBuf(){
  if(noiseBuffer) return noiseBuffer;
  const n = Math.floor(ac.sampleRate * 0.7);
  const b = ac.createBuffer(1, n, ac.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  noiseBuffer = b; return b;
}
function sfx(name, vol=1){
  if(!ac || !sfxBus || ac.state!=="running") return;
  const t = ac.currentTime;
  const g = ac.createGain(); g.connect(sfxBus); g.gain.value = 0.0001;

  const env=(peak,atk,dec)=>{
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak*vol),t+atk);
    g.gain.exponentialRampToValueAtTime(0.0001,t+atk+dec);
  };
  const noise=(dur,type,freq,q,peak)=>{
    const s=ac.createBufferSource(); s.buffer=noiseBuf();
    const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q)f.Q.value=q;
    const ng=ac.createGain();
    ng.gain.setValueAtTime(Math.max(0.0002,peak*vol),t);
    ng.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(ng); ng.connect(sfxBus);
    s.start(t); s.stop(t+dur);
  };

  if(name==="squeak"){
    const o=ac.createOscillator(); o.type="sawtooth";
    o.frequency.setValueAtTime(760,t);
    o.frequency.exponentialRampToValueAtTime(2350,t+0.085);
    o.frequency.exponentialRampToValueAtTime(1500,t+0.15);
    const f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800; f.Q.value=4.5;
    env(0.34,0.012,0.15);
    o.connect(f); f.connect(g); o.start(t); o.stop(t+0.2);
  }
  else if(name==="boing"){
    const o=ac.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(560,t);
    o.frequency.exponentialRampToValueAtTime(105,t+0.3);
    const lfo=ac.createOscillator(); lfo.type="sine"; lfo.frequency.value=16;
    const lg=ac.createGain(); lg.gain.setValueAtTime(120,t);
    lg.gain.exponentialRampToValueAtTime(4,t+0.34);
    lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t+0.36);
    env(0.42,0.01,0.33);
    o.connect(g); o.start(t); o.stop(t+0.38);
  }
  else if(name==="honk"){
    const o1=ac.createOscillator(); o1.type="square"; o1.frequency.setValueAtTime(233,t);
    o1.frequency.exponentialRampToValueAtTime(196,t+0.2);
    const o2=ac.createOscillator(); o2.type="sawtooth"; o2.frequency.setValueAtTime(235.5,t);
    o2.frequency.exponentialRampToValueAtTime(198,t+0.2);
    const f=ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1500;
    const o2g=ac.createGain(); o2g.gain.value=0.45;
    env(0.3,0.014,0.19);
    o1.connect(f); o2.connect(o2g); o2g.connect(f); f.connect(g);
    o1.start(t); o1.stop(t+0.24); o2.start(t); o2.stop(t+0.24);
  }
  else if(name==="boom"){
    const o=ac.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(150,t);
    o.frequency.exponentialRampToValueAtTime(36,t+0.45);
    env(0.62,0.008,0.5);
    o.connect(g); o.start(t); o.stop(t+0.55);
    noise(0.19,"lowpass",1100,0.9,0.3);
  }
  else if(name==="slide"){
    const o=ac.createOscillator(); o.type="triangle";
    o.frequency.setValueAtTime(280,t);
    o.frequency.exponentialRampToValueAtTime(1650,t+0.4);
    const f=ac.createBiquadFilter(); f.type="lowpass";
    f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(4200,t+0.4);
    env(0.26,0.03,0.4);
    o.connect(f); f.connect(g); o.start(t); o.stop(t+0.46);
  }
}

let faceLandmarker=null, modelPromise=null, modelReady=false, modelFailed=false;

function loadModel(){
  if(modelPromise) return modelPromise;
  modelPromise = (async ()=>{
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    const opts = (delegate)=>({
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate
      },
      outputFaceBlendshapes:true,
      runningMode:"VIDEO",
      numFaces:1
    });
    try{
      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU"));
    }catch(e){
      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU"));
    }
    modelReady = true;
    return faceLandmarker;
  })().catch(e=>{ modelFailed = true; console.error("[model]", e); throw e; });
  return modelPromise;
}

/* ---- 웃음 점수 (지정 공식 그대로) ---- */
function scoreFromBlendshapes(cats){
  const m = Object.create(null);
  for(let i=0;i<cats.length;i++) m[cats[i].categoryName]=cats[i].score;
  const v = k => m[k]||0;
  const smile = (v("mouthSmileLeft")  + v("mouthSmileRight"))  / 2;
  const cheek = (v("cheekSquintLeft") + v("cheekSquintRight")) / 2;
  const press = (v("mouthPressLeft")  + v("mouthPressRight"))  / 2;
  const jawOpen = v("jawOpen");
  return smile + cheek*0.55 + Math.max(0, jawOpen-0.35)*0.5 + press*0.25;
}

let lastVideoTime = -1;
let curScore = 0;
let faceSeen  = false;
let lastFaceAt = 0;

function pollFace(now){
  if(!faceLandmarker || !cam.videoWidth || cam.readyState < 2) return;
  if(cam.currentTime === lastVideoTime) return;   // 프레임이 바뀐 경우에만 호출
  lastVideoTime = cam.currentTime;
  let res;
  try{ res = faceLandmarker.detectForVideo(cam, now); }catch(e){ return; }
  const bs = res && res.faceBlendshapes && res.faceBlendshapes[0];
  if(bs && bs.categories && bs.categories.length){
    curScore = scoreFromBlendshapes(bs.categories);
    faceSeen = true;
    lastFaceAt = now;
  }else{
    faceSeen = false;
    curScore = 0;
  }
}

function videoCoverRect(dw,dh,zoom){
  const vw=cam.videoWidth, vh=cam.videoHeight;
  if(!vw||!vh) return null;
  const scale = Math.max(dw/vw, dh/vh) * (zoom||1);
  const sw = dw/scale, sh = dh/scale;
  return { sx:(vw-sw)/2, sy:(vh-sh)/2, sw, sh };
}
function drawCam(c, dx, dy, dw, dh, zoom){
  const r = videoCoverRect(dw,dh,zoom);
  if(!r){ c.fillStyle=C.panel; c.fillRect(dx,dy,dw,dh); return false; }
  c.save();
  c.translate(dx+dw, dy); c.scale(-1,1);           // 좌우반전(거울)
  try{ c.drawImage(cam, r.sx, r.sy, r.sw, r.sh, 0, 0, dw, dh); }catch(e){}
  c.restore();
  return true;
}

const DB_NAME = "dontlaugh", DB_STORE = "memes", MAX_MEMES = 60;
let imgPool = [];                       // {img, ar, url}

function idb(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("no indexedDB"));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE,{keyPath:"id",autoIncrement:true}); };
    r.onsuccess = ()=>res(r.result);
    r.onerror   = ()=>rej(r.error);
  });
}
function tx(db, mode){ return db.transaction(DB_STORE, mode).objectStore(DB_STORE); }
async function dbAll(){
  try{ const db = await idb();
    return await new Promise((res,rej)=>{ const q = tx(db,"readonly").getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); });
  }catch(e){ return []; }
}
async function dbAdd(blob){
  try{ const db = await idb();
    await new Promise((res,rej)=>{ const q = tx(db,"readwrite").add({blob}); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
  }catch(e){}
}
async function dbClear(){
  try{ const db = await idb();
    await new Promise((res,rej)=>{ const q = tx(db,"readwrite").clear(); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); });
  }catch(e){}
}

/* 저장 전에 긴 변 720px 으로 줄여 둔다 (메모리/용량) */
async function shrink(file, max=720){
  let src = null, w = 0, h = 0;
  try{
    if(window.createImageBitmap){ src = await createImageBitmap(file); w = src.width; h = src.height; }
  }catch(e){ src = null; }
  if(!src){
    const u = URL.createObjectURL(file);
    src = await new Promise((res)=>{ const im = new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=u; });
    if(!src){ URL.revokeObjectURL(u); return null; }
    w = src.naturalWidth; h = src.naturalHeight;
    setTimeout(()=>URL.revokeObjectURL(u), 0);
  }
  if(!w || !h) return null;
  const s  = Math.min(1, max/Math.max(w,h));
  const cw = Math.max(1, Math.round(w*s)), ch = Math.max(1, Math.round(h*s));
  const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
  cv.getContext("2d").drawImage(src, 0, 0, cw, ch);
  if(src.close) try{ src.close(); }catch(e){}
  return await new Promise(r=>cv.toBlob(r, "image/jpeg", 0.86));
}
function blobToImg(blob){
  return new Promise(res=>{
    const u = URL.createObjectURL(blob);
    const im = new Image();
    im.onload  = ()=>res({ img:im, ar:(im.naturalWidth/im.naturalHeight)||1, url:u });
    im.onerror = ()=>{ URL.revokeObjectURL(u); res(null); };
    im.src = u;
  });
}
async function loadPool(){
  const rows = await dbAll();
  const out = [];
  for(const r of rows.slice(0, MAX_MEMES)){
    if(!r || !r.blob) continue;
    const it = await blobToImg(r.blob);
    if(it) out.push(it);
  }
  imgPool = out;
  renderThumbs();
}
async function addFiles(list){
  const files = Array.from(list||[]).filter(f=>/^image\//.test(f.type)).slice(0, MAX_MEMES);
  if(!files.length) return;
  setStartNote("memeAdding");
  for(const f of files){
    if(imgPool.length >= MAX_MEMES) break;
    const b = await shrink(f);
    if(!b) continue;
    await dbAdd(b);
    const it = await blobToImg(b);
    if(it) imgPool.push(it);
    renderThumbs();
  }
  setStartNote("ready");
}

function capSub(c, s, y){
  if(!s) return;
  const size = 44;
  c.save();
  c.font = size+'px '+HEAD; c.textAlign = "center"; c.textBaseline = "middle";
  const w = c.measureText(s).width + 52;
  c.fillStyle = "rgba(0,0,0,.6)"; rrect(c, 360-w/2, y-34, w, 68, 12); c.fill();
  c.lineJoin = "round"; c.lineWidth = 10; c.strokeStyle = "#000"; c.strokeText(s,360,y);

}
function redCircle(c, x, y, rx, ry, t){
  c.save(); c.strokeStyle = "#FF2D1F"; c.lineWidth = 12; c.lineCap = "round";
  c.beginPath();
  for(let i=0;i<=46;i++){
    const a = i/46*Math.PI*2*1.09 - 0.5;
    const wob = 1 + Math.sin(a*3 + t*2.2)*0.04;
    const px = x + Math.cos(a)*rx*wob, py = y + Math.sin(a)*ry*wob;
    i ? c.lineTo(px,py) : c.moveTo(px,py);
  }
  c.stroke(); c.restore();
}
function redArrow(c, x1,y1,x2,y2){
  c.save(); c.strokeStyle = "#FF2D1F"; c.fillStyle = "#FF2D1F"; c.lineWidth = 12; c.lineCap = "round";
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  const a = Math.atan2(y2-y1, x2-x1);
  c.beginPath(); c.moveTo(x2,y2);
  c.lineTo(x2-Math.cos(a-0.42)*40, y2-Math.sin(a-0.42)*40);
  c.lineTo(x2-Math.cos(a+0.42)*40, y2-Math.sin(a+0.42)*40);
  c.closePath(); c.fill(); c.restore();
}
const mcv = document.createElement("canvas"), mctx = mcv.getContext("2d");
function mosaic(c, x,y,w,h, cell){
  const sw = Math.max(1, Math.round(w/cell)), sh = Math.max(1, Math.round(h/cell));
  mcv.width = sw; mcv.height = sh;
  try{ mctx.drawImage(c.canvas, x,y,w,h, 0,0,sw,sh); }catch(e){ return; }
  c.save(); c.imageSmoothingEnabled = false;
  try{ c.drawImage(mcv, 0,0,sw,sh, x,y,w,h); }catch(e){}
  c.imageSmoothingEnabled = true; c.restore();
}
/* 딥프라이드 밈 느낌: 과채도 + 성긴 노이즈 */
function deepFry(c, amt){
  if(amt <= 0) return;
  c.save();
  c.globalCompositeOperation = "overlay";
  c.fillStyle = "rgba(255,120,0,"+(0.38*amt)+")"; c.fillRect(0,0,SR.w,SR.h);
  c.globalCompositeOperation = "hard-light";
  c.fillStyle = "rgba(255,0,0,"+(0.2*amt)+")";   c.fillRect(0,0,SR.w,SR.h);
  c.globalCompositeOperation = "source-over";
  c.globalAlpha = 0.12*amt;
  for(let i=0;i<64;i++){ c.fillStyle = i%2 ? "#fff" : "#000"; c.fillRect(Math.random()*SR.w, Math.random()*SR.h, 4, 4); }
  c.restore();
}

const SR = { w:W, h:SR_H };

/* 1. 흔들리는 짤 */

/* 2. 작았다가 화면 꽉 채우며 돌진 + 흰 플래시 */
const st2 = {
  init(){ ss.s = pickSubject(); ss.k = -1; ss.cap = capFor(1); },
  draw(t){
    ctx.fillStyle = "#08160F"; ctx.fillRect(0,0,SR.w,SR.h);

/* 3. 거대한 눈알 두 개 (도형) */
const st3 = {
  init(){ ss.gx=0; ss.gy=0; ss.tx=0; ss.ty=0; ss.next=0; ss.blink=0; ss.nb=1.4; ss.cap=capFor(2); },
  draw(t,dt){
    ctx.fillStyle = "#0E2622"; ctx.fillRect(0,0,SR.w,SR.h);
    if(t > ss.next){ ss.next = t+rnd(0.7,1.5); ss.tx = rnd(-1,1); ss.ty = rnd(-.8,.8); }
    ss.gx = lerp(ss.gx, ss.tx, Math.min(1,dt*3.2)); ss.gy = lerp(ss.gy, ss.ty, Math.min(1,dt*3.2));
    if(t > ss.nb){ ss.nb = t+rnd(1.1,2.8); ss.blink = 1; }
    ss.blink = Math.max(0, ss.blink-dt*7.5);
    const lid = Math.sin(Math.min(1,ss.blink)*Math.PI);
    const eye = (cx)=>{
      const rx = 152, ry = 118*(1-lid*0.94);
      ctx.save();
      ctx.fillStyle = "#F7F3E6"; ctx.beginPath(); ctx.ellipse(cx,262,rx,Math.max(2,ry),0,0,7); ctx.fill();
      ctx.strokeStyle = "#0B1F1D"; ctx.lineWidth = 9; ctx.stroke();
      if(ry > 26){
        ctx.beginPath(); ctx.ellipse(cx,262,rx-6,ry-4,0,0,7); ctx.clip();
        const ix = cx+ss.gx*74, iy = 262+ss.gy*54;
        ctx.fillStyle = "#7A4A1B"; ctx.beginPath(); ctx.arc(ix,iy,62,0,7); ctx.fill();
        ctx.fillStyle = "#0B1F1D"; ctx.beginPath(); ctx.arc(ix,iy,31,0,7); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(ix-20,iy-22,14,0,7); ctx.fill();
        ctx.strokeStyle = "rgba(255,59,47,.35)"; ctx.lineWidth = 3;
        for(let i=0;i<5;i++){ const a = i*1.3+t*0.2;
          ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*rx, 262+Math.sin(a)*ry);
          ctx.quadraticCurveTo(cx+Math.cos(a)*80, 262+Math.sin(a)*40, ix+Math.cos(a)*60, iy+Math.sin(a)*40); ctx.stroke(); }
      }
      ctx.restore();
    };
    eye(190); eye(530);
    capSub(ctx, ss.cap, 486);
  }
};
/* 4. 짤들이 위아래로 통통 튀며 가로질러 감 */
const st4 = {

/* 5. 점점 빨리 회전하다 화면 밖으로 날아감 */
const st5 = {

  draw(t){

/* 6. 짤 26개가 비처럼 쏟아짐 */

/* 7. 가장자리에서 아주 천천히 기어오다 마지막에 확 튀어나옴 */
const st7 = {
  init(){ ss.s = pickSubject(); ss.side = (Math.random()*4)|0; ss.k = -1; ss.cap = capFor(6); },
  draw(t){
    ctx.fillStyle = "#0A1D1A"; ctx.fillRect(0,0,SR.w,SR.h);
    const per = 4.6, p = (t%per)/per, k = Math.floor(t/per);
    if(k !== ss.k){ ss.k = k; ss.s = pickSubject(); ss.side = (Math.random()*4)|0; ss.pop = false; ss.cap = capFor(6); }
    const creep = Math.min(1, p/0.86);
    const ease  = easeIn(creep)*0.35 + creep*0.65;
    let x,y;
    if(ss.side === 0){ x = -150+ease*330; y = 262+Math.sin(t*3)*18; }
    else if(ss.side === 1){ x = 870-ease*330; y = 262+Math.sin(t*3)*18; }
    else if(ss.side === 2){ x = 360+Math.sin(t*3)*24; y = -150+ease*290; }
    else { x = 360+Math.sin(t*3)*24; y = 690-ease*290; }
    let s = 1;
    if(p > 0.86){
      const q = (p-0.86)/0.14;
      if(!ss.pop){ ss.pop = true; sfx("honk",1); }
      x = lerp(x,360,easeOut(q)); y = lerp(y,262,easeOut(q)); s = 1+easeOut(q)*1.5;
      ctx.fillStyle = "rgba(255,59,47,"+(0.3*(1-q))+")"; ctx.fillRect(0,0,SR.w,SR.h);
    }
    drawSubject(ctx, ss.s, x, y, 230, Math.sin(t*2)*0.1, s, s);
    if(p <= 0.86) capSub(ctx, ss.cap, 502);
    else capBig(ctx, ss.cap, 360, 492, 96, 0);

};
/* 8. 세로로 극단적으로 늘어났다 가로로 납작해짐 */

/* 10. 라이브 웹캠 가로 슬라이스 26개 물결 왜곡 */

/* 12. 아주 작아졌다가 폭발하듯 커짐 */

const STIMS = [st1,st2,st3,st4,st5,st6,st7,st8,st9,st10,st11,st12];
let bag = [], curStim = null, stimStart = 0, stimDur = 0;

function nextStim(now){
  if(!bag.length) bag = shuffle(STIMS.map((_,i)=>i));
  const id = bag.pop();
  curStim = STIMS[id];
  stimStart = now;
  stimDur = rnd(4000,6000);
  ss = {};
  if(curStim.init) curStim.init();
}
function drawStim(now, dt){
  if(!curStim || now-stimStart > stimDur) nextStim(now);
  const t = (now-stimStart)/1000;
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,SR.w,SR.h); ctx.clip();
  curStim.draw(t, dt);
  ctx.restore();
}

/* ============================================================
   6. HUD / 카운트다운 / 실패 연출 렌더링
   ============================================================ */
let barShown = 0;
function sens(){ return SENS[diff]; }
function diffName(){ return T(diff==="easy"?"t_easy":diff==="hard"?"t_hard":"t_normal"); }

function fitFont(s, maxW, family, size){
  ctx.font = size+"px "+family;
  let w = ctx.measureText(s).width;
  while(w > maxW && size > 18){ size = size*(maxW/w)*0.985; ctx.font=size+"px "+family; w=ctx.measureText(s).width; }
  return size;
}
function drawTensionBar(){
  const ratio = clamp((curScore - base)/sens(), 0, 1);
  barShown = lerp(barShown, ratio, 0.35);
  ctx.fillStyle = "rgba(245,238,221,.13)";
  ctx.fillRect(0, H-BAR_H, W, BAR_H);
  ctx.fillStyle = barShown > 0.7 ? C.red : C.amber;
  ctx.fillRect(0, H-BAR_H, W*barShown, BAR_H);
  if(barShown > 0.7){
    ctx.fillStyle = "rgba(255,59,47,.16)";
    ctx.fillRect(0, CAM_Y, W, CAM_S);
  }
}
function drawWatermark(){
  txt(ctx, T("wm"), W-24, H-BAR_H-16, '25px '+BODY, "rgba(245,238,221,.6)", "right", "bottom", "rgba(0,0,0,.55)", 5);
}
function drawTimer(now){
  const el = (now - playStart)/1000;
  const s  = el.toFixed(1) + T("secShort");
  txt(ctx, s, 26, 578, '76px '+HEAD, C.cream, "left", "top", "rgba(0,0,0,.88)", 11);
}
function drawHud(now){
  drawTimer(now);
  const goneFor = now - lastFaceAt;
  if(goneFor > 420){
    const left = Math.max(0,(PLAY_NOFACE_MS-goneFor)/1000);
    const a = 0.55 + 0.45*Math.sin(now/90);
    ctx.fillStyle = "rgba(255,59,47,"+(0.14*a)+")"; ctx.fillRect(0,CAM_Y,W,CAM_S);
    txt(ctx, T("cd_noface"), 360, 960, '46px '+HEAD, C.red, "center","middle","rgba(0,0,0,.75)",10);
    txt(ctx, left.toFixed(1)+T("secShort"), 360, 1030, '38px '+HEAD, C.cream, "center","middle","rgba(0,0,0,.75)",9);
  }
  drawTensionBar();
  drawWatermark();
}

function renderPlay(now, dt){
  ctx.fillStyle = C.deep; ctx.fillRect(0,0,W,H);
  drawStim(now, dt);
  const el = now - playStart;
  if(el < 700){
    const a = 1 - el/700;
    txt(ctx, T("cd_go"), 360, 280, (150+ (1-a)*40)+'px '+HEAD,
        "rgba(255,255,255,"+a+")", "center","middle","rgba(11,31,29,"+(a*0.7)+")", 16);
  }
  if(!drawCam(ctx, 0, CAM_Y, CAM_S, CAM_S, 1)){
    txt(ctx, "…", 360, 920, '90px '+HEAD, C.muted);
  }
  ctx.fillStyle = C.line; ctx.fillRect(0, CAM_Y-4, W, 4);
  drawHud(now);
}

function renderCountdown(now){
  ctx.fillStyle = C.deep; ctx.fillRect(0,0,W,H);
  /* --- 자극 영역: 카운트다운 --- */
  ctx.fillStyle = C.panel; ctx.fillRect(0,0,W,SR_H);
  ctx.strokeStyle = "rgba(30,71,64,.9)"; ctx.lineWidth = 2;
  for(let i=1;i<7;i++){ ctx.beginPath(); ctx.moveTo(0,i*80); ctx.lineTo(W,i*80); ctx.stroke(); }

  const left = Math.max(0, CD_MS - (now - cdStart));
  const n = Math.max(1, Math.ceil(left/1000));
  const frac = 1 - ((left % 1000)/1000);
  const pop = 1 + (1 - easeOut(Math.min(1, frac*3)))*0.34;

  const ring = 1 - left/CD_MS;
  ctx.save();
  ctx.translate(360, 232);
  ctx.lineWidth = 12; ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(30,71,64,1)";
  ctx.beginPath(); ctx.arc(0,0,132,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = noFace ? C.red : C.amber;
  ctx.beginPath(); ctx.arc(0,0,132,-Math.PI/2, -Math.PI/2 + Math.PI*2*ring); ctx.stroke();
  ctx.restore();
  txt(ctx, String(n), 360, 232, (170*pop).toFixed(0)+'px '+HEAD, noFace ? C.red : C.amber);

  if(noFace){
    txt(ctx, T("cd_noface"), 360, 412, '40px '+HEAD, C.red, "center","middle");
  }else{
    txt(ctx, T("cd_calib"), 360, 400, '26px '+BODY, C.muted, "center","middle");
    const s = fitFont(T("cd_hold"), 640, BODY, 27);
    txt(ctx, T("cd_hold"), 360, 448, s.toFixed(1)+'px '+BODY, C.cream, "center","middle");
  }
  txt(ctx, diffName()+" · "+sens().toFixed(2), 360, 512, '22px '+BODY, "rgba(122,148,144,.85)", "center","middle");

  /* --- 카메라 영역 + 얼굴 가이드 --- */
  drawCam(ctx, 0, CAM_Y, CAM_S, CAM_S, 1);
  ctx.save();
  ctx.setLineDash([16,14]); ctx.lineWidth = 5;
  ctx.strokeStyle = noFace ? "rgba(255,59,47,.95)" : "rgba(255,176,32,.7)";
  ctx.beginPath(); ctx.ellipse(360, 900, 210, 268, 0, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = C.line; ctx.fillRect(0, CAM_Y-4, W, 4);
  drawWatermark();
}

function renderLoading(now){
  ctx.fillStyle = C.deep;  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = C.panel; ctx.fillRect(0,0,W,SR_H);
  ctx.save();
  ctx.translate(360, 236); ctx.lineWidth = 12; ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(30,71,64,1)";
  ctx.beginPath(); ctx.arc(0,0,100,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = C.amber;
  const a = now/380;
  ctx.beginPath(); ctx.arc(0,0,100,a,a+1.9); ctx.stroke();
  ctx.restore();
  const fs = fitFont(T("prep"), 620, BODY, 30);
  txt(ctx, T("prep"), 360, 404, fs.toFixed(1)+'px '+BODY, C.cream);
  txt(ctx, diffName()+" · "+sens().toFixed(2), 360, 462, '22px '+BODY, "rgba(122,148,144,.85)");
  drawCam(ctx, 0, CAM_Y, CAM_S, CAM_S, 1);
  ctx.fillStyle = C.line; ctx.fillRect(0, CAM_Y-4, W, 4);
  drawWatermark();
}

function drawFail(now){
  const p = clamp((now - failStart)/FAIL_MS, 0, 1);
  /* 스냅샷의 카메라 영역만 9:16 커버 크롭으로 채우며 천천히 푸시인 */
  const z  = 1 + 0.17*easeOut(p);
  const sh = 720/z, sw = sh*(720/1280), sx = (720-sw)/2, sy = CAM_Y + (720-sh)/2;
  ctx.fillStyle = C.deep; ctx.fillRect(0,0,W,H);
  if(snapCv){ try{ ctx.drawImage(snapCv, sx, sy, sw, sh, 0, 0, W, H); }catch(e){} }

  /* 빨간 플래시가 빠르게 사라짐 */
  const fa = Math.max(0, 1 - p/0.2)*0.92;
  if(fa > 0){ ctx.fillStyle = "rgba(255,59,47,"+fa+")"; ctx.fillRect(0,0,W,H); }

  /* 하단 400px 그라디언트 슬랩 */
  const g = ctx.createLinearGradient(0, H-400, 0, H);
  g.addColorStop(0,   "rgba(11,31,29,0)");
  g.addColorStop(0.42,"rgba(11,31,29,.86)");
  g.addColorStop(1,   "rgba(11,31,29,.985)");
  ctx.fillStyle = g; ctx.fillRect(0, H-400, W, 400);

  const rise = easeOut(clamp((p-0.05)/0.32, 0, 1));
  ctx.save();
  ctx.globalAlpha = rise;
  ctx.translate(0, (1-rise)*34);

  const esc = failReason === "escape";
  txt(ctx, esc ? T("failEsc") : T("fail"), 360, 972, '62px '+HEAD, C.red, "center","middle","rgba(0,0,0,.5)",8);

  const secTxt = (finalMs/1000).toFixed(1) + T("secShort");
  const fs = fitFont(secTxt, 620, HEAD, 134);
  txt(ctx, secTxt, 360, 1090, fs.toFixed(1)+'px '+HEAD, C.cream, "center","middle","rgba(0,0,0,.45)",10);

  const sub = esc ? T("escNote") : gradeOf(finalMs/1000);
  const ss2 = fitFont(sub, 620, BODY, 28);
  txt(ctx, sub, 360, 1178, ss2.toFixed(1)+'px '+BODY, C.amber, "center","middle");

  txt(ctx, T("wm"), 360, 1236, '24px '+BODY, "rgba(122,148,144,.95)", "center","middle");
  ctx.restore();

  if(p >= 1 && !failDone){ failDone = true; finishFail(); }
}

/* ============================================================
   7. 게임 상태 머신
   ============================================================ */
let phase = "idle";            // idle | countdown | play | fail | done
let diff  = "normal";
let cdStart = 0, cdSamples = [], base = 0, noFace = false;
let playStart = 0, overSince = 0;
let failStart = 0, failReason = "laugh", finalMs = 0, failDone = false, snapCv = null;
let raf = 0, lastT = 0;

function median(a){
  if(!a.length) return 0;
  const b = a.slice().sort((x,y)=>x-y), n = b.length;
  return n % 2 ? b[(n-1)>>1] : (b[n/2-1]+b[n/2])/2;
}
function gradeOf(sec){
  const g = STR[LANG].grades;
  for(const x of g) if(sec < x.t) return x.s;
  return g[g.length-1].s;
}

function beginCountdown(){
  phase = "countdown";
  const now = performance.now();
  cdStart = now; cdSamples = []; noFace = false;
  base = 0; curScore = 0; faceSeen = false; lastFaceAt = now; lastVideoTime = -1;
  bag = []; curStim = null; barShown = 0; failDone = false; snapCv = null;
  lastT = now;
  if(!raf) raf = requestAnimationFrame(loop);
}
function stepCountdown(now){
  /* 얼굴이 0.8초 이상 안 보이면 카운트다운 리셋 (base가 0으로 잡히는 것 방지) */
  if(now - lastFaceAt > CD_NOFACE_MS){
    cdStart = now; cdSamples.length = 0; noFace = true;
    return;
  }
  if(faceSeen){ noFace = false; cdSamples.push(curScore); }
  if(now - cdStart >= CD_MS){
    if(cdSamples.length < MIN_SAMPLES){   // 샘플이 모자라면 base를 믿을 수 없다 → 다시
      cdStart = now; cdSamples.length = 0; noFace = true; return;
    }
    base = median(cdSamples);
    beginPlay(now);
  }
}
function beginPlay(now){
  phase = "play";
  playStart = now; overSince = 0; lastFaceAt = now; barShown = 0;
  nextStim(now);
  startRecording();                       // 카운트다운이 끝나는 순간 녹화 시작
  sfx("slide", 0.7);
}
function judge(now){
  /* 게임 중 얼굴이 1.3초 이상 안 보이면 '도망'으로 실패 */
  if(now - lastFaceAt > PLAY_NOFACE_MS){ triggerFail(now, "escape"); return; }
  if((curScore - base) > sens()){
    if(!overSince) overSince = now;
    else if(now - overSince >= HOLD_MS) triggerFail(now, "laugh");
  }else{
    overSince = 0;
  }
}
function triggerFail(now, reason){
  if(phase !== "play") return;
  phase = "fail"; failReason = reason; failStart = now; failDone = false;
  finalMs = Math.max(0, now - playStart);
  snapCv = document.createElement("canvas");
  snapCv.width = W; snapCv.height = H;
  try{ snapCv.getContext("2d").drawImage(stage, 0, 0); }catch(e){ snapCv = null; }
  sfx("boom", 1);
  setTimeout(()=>sfx("slide", 0.45), 110);
}
function finishFail(){
  phase = "done";
  if(raf){ cancelAnimationFrame(raf); raf = 0; }
  if(recorder && recorder.state === "recording"){
    setTimeout(onRecordingDone, 3000);            // onstop이 오지 않는 경우 대비
    try{ recorder.stop(); }catch(e){ onRecordingDone(); }
  }else{
    onRecordingDone();
  }
}

function loop(now){
  raf = requestAnimationFrame(loop);
  let dt = (now - lastT)/1000; lastT = now;
  if(!(dt > 0) || dt > 0.08) dt = 0.016;

  pollFace(now);

  if(phase === "loading"){ renderLoading(now); return; }
  if(phase === "countdown"){ stepCountdown(now); }
  if(phase === "countdown"){ renderCountdown(now); return; }
  if(phase === "play"){ renderPlay(now, dt); judge(now); return; }
  if(phase === "fail"){ drawFail(now); return; }
}

let mediaStream=null, capStream=null, recorder=null, recMime="", chunks=[], recBlob=null, resURL=null, resultShown=false;

function pickMime(){
  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
  const list = [
    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',   // 인스타그램은 webm을 안 받는다 → mp4 우선
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm'
  ];
  for(const m of list){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return "";
}
function setupRecorder(){
  recorder = null; chunks = []; recBlob = null; recMime = "";
  if(!window.MediaRecorder || !stage.captureStream) return;
  try{ capStream = stage.captureStream(30); }catch(e){ capStream = null; return; }
  const tracks = capStream.getVideoTracks().slice();
  if(recDest && recDest.stream.getAudioTracks().length) tracks.push(recDest.stream.getAudioTracks()[0]);
  const mixed = new MediaStream(tracks);
  const m = pickMime();
  try{
    recorder = m ? new MediaRecorder(mixed, { mimeType:m, videoBitsPerSecond:5000000, audioBitsPerSecond:128000 })
                 : new MediaRecorder(mixed);
  }catch(e){
    try{ recorder = new MediaRecorder(mixed); }catch(e2){ recorder = null; return; }
  }
  recMime = recorder.mimeType || m || "video/webm";
  recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    recBlob = chunks.length ? new Blob(chunks, { type: recMime.split(";")[0] }) : null;
    onRecordingDone();
  };
  recorder.onerror = () => { onRecordingDone(); };
}
function startRecording(){
  if(recorder && recorder.state === "inactive"){
    try{ recorder.start(); }catch(e){ recorder = null; }
  }
}
function stopMedia(){
  try{ if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ if(capStream) capStream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ cam.pause(); cam.srcObject = null; }catch(e){}
  try{ if(micNode) micNode.disconnect(); }catch(e){}
  mediaStream = null; capStream = null; micNode = null;
}
function onRecordingDone(){
  if(resultShown) return;
  resultShown = true;
  stopMedia();
  showResult();
}

const startBtn=$("#startBtn"), startNote=$("#startNote"), resNote=$("#resNote"),
      langBtn=$("#langBtn"), vidWrap=$("#vidWrap");
let startNoteKey = "ready", startNoteWarn = false, resNoteKey = "";
let micDenied = false, permState = "", lastErr = "";

const BUILD = "b5";     // 어떤 빌드가 떠 있는지 눈으로 확인하기 위한 스탬프
function inFrame(){ try{ return window.self !== window.top; }catch(e){ return true; } }
function renderDiag(){
  const d = $("#diag"); if(!d) return;
  const p = [
    BUILD,
    (location.protocol || "?").replace(":",""),
    window.isSecureContext === false ? "INSECURE" : "secure",
    inFrame() ? "IFRAME" : "top",
    "gum:" + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? "y" : "N"),
    "rec:" + (window.MediaRecorder ? "y" : "N")
  ];
  if(permState) p.push("cam:" + permState);
  if(micDenied) p.push("mic:off");
  if(lastErr)   p.push("err:" + lastErr);
  d.textContent = p.join(" · ");
  d.classList.toggle("bad", !!lastErr);
}
async function refreshPerm(){
  if(navigator.permissions && navigator.permissions.query){
    try{
      const st = await navigator.permissions.query({ name:"camera" });
      permState = st && st.state || "";
      if(st && "onchange" in st) st.onchange = ()=>{ permState = st.state; renderDiag(); };
    }catch(e){ permState = ""; }
  }
  renderDiag();
}

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
}
function setStartNote(key, warn){
  startNoteKey = key; startNoteWarn = !!warn;
  startNote.textContent = key ? T(key) : "";
  startNote.classList.toggle("warn", !!warn);
}
function setResNote(key){
  resNoteKey = key;
  resNote.textContent = key ? T(key) : "";
}
function fileExt(){ return (recBlob && /mp4/.test(recBlob.type)) ? "mp4" : (recBlob ? "webm" : "mp4"); }
function fileName(){ return "dontlaugh_" + (finalMs/1000).toFixed(1) + "s." + fileExt(); }

function renderResultTexts(){
  const sec = finalMs/1000;
  $("#resTime").textContent = sec.toFixed(1);
  $("#resGrade").textContent = failReason === "escape" ? T("escGrade") : gradeOf(sec);
  $("#resMeta").textContent = diffName() + " · " + (failReason==="escape" ? T("r_escape") : T("r_laugh"));
}
function showResult(){
  renderResultTexts();
  if(resURL){ URL.revokeObjectURL(resURL); resURL = null; }
  const miss = $("#vidMiss");
  if(recBlob && recBlob.size){
    if(miss) miss.remove();
    resURL = URL.createObjectURL(recBlob);
    resVideo.style.display = "";
    resVideo.src = resURL;
    resVideo.muted = true;
    resVideo.play().catch(()=>{});
    setResNote("");
  }else{
    resVideo.removeAttribute("src"); resVideo.load?.();
    resVideo.style.display = "none";
    if(!miss){
      const d = document.createElement("div");
      d.id = "vidMiss"; d.className = "vidmiss"; d.textContent = T("noRec");
      vidWrap.appendChild(d);
    }else{ miss.textContent = T("noRec"); }
    setResNote("noRec");
  }
  show("scr-result");
}
function saveBlob(){
  if(!recBlob) return false;
  const url = URL.createObjectURL(recBlob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  return true;
}
async function doShare(){
  if(!recBlob){ setResNote("noRec"); return; }
  const sec = (finalMs/1000).toFixed(1);
  const file = new File([recBlob], fileName(), { type: recBlob.type || "video/mp4" });
  const payload = { files:[file], title:T("shareTitle"), text:STR[LANG].shareText(sec) };
  if(navigator.canShare && navigator.share){
    let ok = false;
    try{ ok = navigator.canShare(payload); }catch(e){ ok = false; }
    if(ok){
      try{ await navigator.share(payload); setResNote(""); return; }
      catch(e){
        if(e && e.name === "AbortError"){ setResNote(""); return; }
        setResNote("shareErr"); return;
      }
    }
  }
  if(saveBlob()) setResNote("shareUnsupported");
}

async function fontsReady(){
  if(!document.fonts) return;
  try{ await document.fonts.ready; }catch(e){}
  try{
    await Promise.all([
      document.fonts.load('76px "Black Han Sans"', "0123456789.초s실패도망시작"),
      document.fonts.load('700 30px "Noto Sans KR"', "안웃기챌린지얼굴이화면에없습니다기준표정측정중"),
      document.fonts.load('400 25px "Noto Sans KR"', "안웃기챌린지")
    ]);
  }catch(e){}
  try{ await document.fonts.ready; }catch(e){}
}
function waitVideo(){
  return new Promise(res=>{
    const t0 = performance.now();
    (function tick(){
      if(cam.videoWidth && cam.readyState >= 2) return res(true);
      if(performance.now()-t0 > 6000) return res(false);
      requestAnimationFrame(tick);
    })();
  });
}
async function getStream(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    const err = new Error("getUserMedia unavailable (HTTPS required)");
    err.name = "SecurityError"; throw err;
  }
  const v = { facingMode:"user", width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30} };
  try{
    return await navigator.mediaDevices.getUserMedia({ video:v, audio:true });
  }catch(e){
    /* 마이크가 없거나 차단돼 있으면 카메라+마이크 동시 요청은 팝업조차 없이
       NotAllowedError 로 죽는다. 카메라만으로 한 번 더 시도한다. */
    console.warn("[gum] video+audio failed:", e && e.name, e && e.message);
    try{
      const s2 = await navigator.mediaDevices.getUserMedia({ video:v, audio:false });
      micDenied = true;
      return s2;
    }catch(e2){
      console.warn("[gum] video-only failed:", e2 && e2.name, e2 && e2.message);
      throw (e2 && e2.name === "NotAllowedError") ? e : e2;
    }
  }
}
async function showCamError(e){
  const n = (e && e.name) || "";
  let key;
  if(n === "NotFoundError" || n === "OverconstrainedError" || n === "DevicesNotFoundError") key = "err_nodev";
  else if(n === "NotReadableError" || n === "AbortError" || n === "TrackStartError")        key = "err_busy";
  else if(n === "NotAllowedError" || n === "PermissionDeniedError")                          key = "err_denied";
  else if(n === "SecurityError" || window.isSecureContext === false)                         key = "err_insecure";
  else key = "";

  /* 브라우저에 '차단'으로 저장돼 있으면 팝업 자체가 안 뜬다 → 그에 맞는 안내 */
  if(key === "err_denied" && navigator.permissions && navigator.permissions.query){
    try{
      const st = await navigator.permissions.query({ name:"camera" });
      if(st && st.state === "denied") key = "err_blocked";
    }catch(err){}
  }
  /* 다른 사이트에 iframe 으로 박혀 있으면 allow="camera" 없이는 무조건 막힌다 */
  if((key === "err_denied" || key === "err_blocked") && inFrame()) key = "err_iframe";

  lastErr = n || "unknown";
  console.error("[camera]", n, e);
  if(key) setStartNote(key, true);
  else{
    setStartNote("", true);
    startNote.textContent = T("err_generic") + (n ? n + ": " : "") + ((e && e.message) || e);
    startNote.classList.add("warn");
  }
  renderDiag();
  startBtn.disabled = false;
  show("scr-start");
}

async function start(){
  /* 여기서 무슨 예외가 나든 화면에 보이게 한다 (조용히 아무 일도 안 일어나는 것 방지) */
  try{ await startInner(); }
  catch(e){
    lastErr = (e && e.name) || "boot";
    console.error("[start]", e);
    setStartNote("", true);
    startNote.textContent = T("err_boot") + ((e && (e.name+": "+e.message)) || e);
    startNote.classList.add("warn");
    renderDiag();
    startBtn.disabled = false;
    show("scr-start");
  }
}
async function startInner(){
  if(phase === "loading" || phase === "countdown" || phase === "play" || phase === "fail") return;
  startBtn.disabled = true;
  lastErr = ""; micDenied = false;
  setTimeout(()=>{ if(phase === "idle") startBtn.disabled = false; }, 8000);  // 팝업이 안 뜨면 다시 누를 수 있게
  resultShown = false; recBlob = null; chunks = [];
  setStartNote("asking");

  /* ── 여기부터 첫 await 전까지는 클릭 제스처(user activation)가 살아 있다 ──
     getUserMedia 를 await 뒤로 미루면 Safari/iOS 는 권한 팝업조차 띄우지 않고
     바로 NotAllowedError 를 던진다. 모델 로딩은 권한을 받은 뒤에 한다. */
  unlockAudio();
  const streamP = getStream();
  /* ──────────────────────────────────────────────────────────────────── */

  let stream;
  try{ stream = await streamP; }
  catch(e){ await showCamError(e); return; }

  mediaStream = stream;
  cam.srcObject = stream;
  cam.muted = true; cam.playsInline = true;
  try{ await cam.play(); }catch(e){}

  /* 카메라 미리보기를 먼저 띄워 두고 그 뒤에서 모델/폰트를 받는다 */
  phase = "loading";
  show("scr-game");
  startBtn.disabled = false;
  lastT = performance.now();
  if(!raf) raf = requestAnimationFrame(loop);

  await waitVideo();
  if(phase !== "loading") return;

  await fontsReady();               // 웹폰트가 준비돼야 캔버스 텍스트가 제대로 그려진다
  if(phase !== "loading") return;

  try{ await loadModel(); }
  catch(e){
    if(phase !== "loading") return;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    phase = "idle"; stopMedia();
    setStartNote("err_model", true);
    show("scr-start");
    return;
  }
  if(phase !== "loading") return;

  initAudio(stream);
  setupRecorder();
  setStartNote(micDenied ? "noMic" : "ready");
  refreshPerm();
  beginCountdown();
}
function goHome(){
  if(raf){ cancelAnimationFrame(raf); raf = 0; }
  phase = "idle";        // 진행 중이던 loading 단계도 이 검사로 중단된다
  stopMedia();
  if(recorder && recorder.state === "recording"){ try{ recorder.stop(); }catch(e){} }
  recorder = null;
  try{ resVideo.pause(); }catch(e){}
  if(resURL){ try{ resVideo.removeAttribute("src"); }catch(e){} URL.revokeObjectURL(resURL); resURL = null; }
  setStartNote("ready");
  show("scr-start");
}

$("#shareBtn").addEventListener("click", doShare);
$("#saveBtn").addEventListener("click", ()=>{ if(saveBlob()) setResNote("saved"); else setResNote("noRec"); });
$("#againBtn").addEventListener("click", ()=>{ try{ resVideo.pause(); }catch(e){} start(); });
$("#homeBtn").addEventListener("click", goHome);
resVideo.addEventListener("click", ()=>{ resVideo.muted = false; resVideo.play().catch(()=>{}); });

/* 탭을 벗어나면 감지가 멈추므로 얼굴 실종 타이머가 알아서 '도망' 처리한다 */
window.addEventListener("pagehide", ()=>{ if(phase!=="idle" && phase!=="done") stopMedia(); });

applyI18n();
setStartNote("ready");
refreshPerm();
loadPool();
ctx.fillStyle = C.deep; ctx.fillRect(0,0,W,H);
</script>
